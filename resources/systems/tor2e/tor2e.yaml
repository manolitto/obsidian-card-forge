id: tor2e
name: "The One Ring 2E"

# Modelled on the second edition's rulebook: dark red-brown frames, a
# parchment field, deep red rules and diamonds holding the key numbers,
# EB Garamond small caps for the titles and Source Sans for the text.
# Bilingual, German first — the German edition's terminology in the
# aliases and the captions. The sample values are invented.
#
# Two card types: a piece of gear — a weapon, an armour or a shield, told
# apart by which stats it carries — and an adversary on the large card,
# with the rulebook's stat block and its picture on the back.
#
# The notes are written in the frontmatter, as a vault's reference notes
# are: the block names the system, and the tags name the card type.
languages: [de, en]

stylesheet: styles/tor2e.css

partial-templates:
  diamond: templates/diamond.hbs

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, anzeigename, display-name]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  description:
    slot: front-text
    aliases: [beschreibung]
    description:
      de: "Beschreibung oder Stimmungstext — im Block, oder als Abschnitt `## Beschreibung` der Notiz."
      en: "A description or flavour — in the block, or as a `## Beschreibung` section of the note."

  image:
    slot: back-image
    aliases: [bild, img]
    description:
      de: "Bild der Karte als Wikilink (`[[Langschwert.png]]`), Embed oder Dateiname — auf der Rückseite, groß."
      en: "The card's picture as a wikilink (`[[Langschwert.png]]`), embed or file name — on the back, large."
    sample: "[[Jagdspeer.png]]"

  reference:
    slot: front-footer
    aliases: [referenz, buch, quelle]
    description:
      de: "Quellenangabe — Regelbuchseite oder Wikilink."
      en: "Source reference — rulebook page or wikilink."
    sample:
      de: "Regelbuch S. 74"
      en: "Rulebook p. 74"

translations:
  de:
    back-label: "Der Eine Ring"
  en:
    back-label: "The One Ring"

card-types:
  # ── gear ────────────────────────────────────────────────────────────
  # A weapon, an armour or a shield: the key numbers in diamonds, then
  # the captioned lines, the picture, the source. The kind in the header
  # follows from the stats — a parry modifier makes a shield, a
  # protection value an armour, anything else a weapon.
  gear:
    front-template: templates/gear-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/gear.css

    translations:
      de:
        back-label: "Ausrüstung"
        type-shield: "Schild"
        type-armour: "Rüstung"
        type-weapon: "Waffe"
        front-damage-label: "Schaden"
        front-protection-label: "Schutz"
        front-parry-modifier-label: "Paradebonus"
        front-injury-label: "Verletzung"
        front-injury-1h-label: "Verletzung (1-händig)"
        front-injury-2h-label: "Verletzung (2-händig)"
        front-load-label: "Belastung"
        front-proficiency-label: "Kampffähigkeit:"
        front-type-label: "Art:"
        front-standard-label: "Mindest-Lebensstandard:"
        front-notes-label: "Anmerkungen:"
      en:
        back-label: "Gear"
        type-shield: "Shield"
        type-armour: "Armour"
        type-weapon: "Weapon"
        front-damage-label: "Damage"
        front-protection-label: "Protection"
        front-parry-modifier-label: "Parry modifier"
        front-injury-label: "Injury"
        front-injury-1h-label: "Injury (1-handed)"
        front-injury-2h-label: "Injury (2-handed)"
        front-load-label: "Load"
        front-proficiency-label: "Combat proficiency:"
        front-type-label: "Type:"
        front-standard-label: "Minimum standard of living:"
        front-notes-label: "Notes:"

    properties:
      name:
        sample:
          de: "Jagdspeer"
          en: "Hunting spear"

      description:
        slot: ~

      image:
        slot: front-image

      damage:
        slot: front-damage
        aliases: [schaden]
        description:
          de: "Schaden der Waffe — der Wert, der bei einem Treffer zu Ausdauerverlust wird."
          en: "The weapon's damage — the value a hit takes off Endurance."
        sample: 4

      injury:
        slot: front-injury
        aliases: [verletzung]
        description:
          de: "Verletzung — ab diesem Wert auf dem Heldenwürfel wird ein Treffer zum Durchbohrenden Treffer."
          en: "Injury — a Feat Die at this or more makes a hit a Piercing Blow."

      injury-1h:
        slot: front-injury-1h
        aliases: [verletzung-1h]
        description:
          de: "Verletzung bei einhändiger Führung, für eine Waffe, die beides kann."
          en: "Injury when wielded one-handed, for a weapon that can be either."
        sample: 14

      injury-2h:
        slot: front-injury-2h
        aliases: [verletzung-2h]
        description:
          de: "Verletzung bei beidhändiger Führung."
          en: "Injury when wielded two-handed."
        sample: 16

      load:
        slot: front-load
        aliases: [belastung]
        description:
          de: "Belastung — zählt zur Gesamtbelastung und damit zur Erschöpfung."
          en: "Load — counts toward the total Load and so toward Fatigue."
        sample: 2

      protection:
        slot: front-protection
        aliases: [schutz]
        description:
          de: "Schutz einer Rüstung in Schutzwürfeln — „2W“."
          en: "An armour's protection in protection dice — \"2d\"."

      parry-modifier:
        slot: front-parry-modifier
        aliases: [parade-modifikator, paradebonus]
        description:
          de: "Paradebonus eines Schildes — +1 Faustschild, +2 Schild, +3 Großer Schild."
          en: "A shield's parry modifier — +1 buckler, +2 shield, +3 great shield."

      combat-proficiency:
        slot: front-proficiency
        aliases: [kampffähigkeit, kampffaehigkeit]
        description:
          de: "Die Kampffähigkeit, mit der die Waffe geführt wird — Äxte, Bögen, Speere, Schwerter; gern als Wikilink."
          en: "The combat proficiency the weapon is wielded with — Axes, Bows, Spears, Swords; a wikilink if you like."
        sample:
          de: "[[Speere]]"
          en: "[[Spears]]"

      type:
        slot: front-type
        aliases: [typ, art]
        description:
          de: "Art der Ausrüstung als Zeile im Text — Waffe, Rüstung, Schild; gern als Wikilink."
          en: "The kind of gear as a line in the text — weapon, armour, shield; a wikilink if you like."

      minimum-standard-of-living:
        slot: front-standard
        aliases: [mindest-lebensstandard, lebensstandard]
        description:
          de: "Mindest-Lebensstandard, um den Gegenstand ohne Weiteres zu besitzen — Ärmlich, Bescheiden, Gewöhnlich, Wohlhabend, Reich."
          en: "The minimum standard of living to own the item without further ado — Poor, Frugal, Common, Prosperous, Rich."
        sample:
          de: "Bescheiden"
          en: "Frugal"

      notes:
        slot: front-notes
        aliases: [notizen, anmerkungen]
        description:
          de: "Anmerkungen oder besondere Eigenschaften (Markdown)."
          en: "Notes or special qualities (markdown)."
        sample:
          de: "Kann ein- oder beidhändig geführt und geworfen werden."
          en: "May be wielded one- or two-handed, and thrown."

  # ── npc ─────────────────────────────────────────────────────────────
  # An adversary on the large card: the distinctive features, the five
  # small diamonds, the attribute level in the large one, the combat
  # proficiencies, the fell abilities, the description; the picture with
  # the name over it on the back.
  npc:
    front-template: templates/npc-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/npc.css
    card-size: large

    translations:
      de:
        back-label: "Widersacher"
        front-endurance-label: "Ausdauer"
        front-might-label: "Stärke"
        front-hate-label: "Hass"
        front-resolve-label: "Entschlossen"
        front-parry-label: "Parade"
        front-armour-label: "Rüstung"
        front-attribute-label: "Attributs­stufe"
        front-proficiencies-label: "Kampffähigkeiten"
        front-abilities-label: "Grausame Fähigkeiten"
      en:
        back-label: "Adversary"
        front-endurance-label: "Endurance"
        front-might-label: "Might"
        front-hate-label: "Hate"
        front-resolve-label: "Resolve"
        front-parry-label: "Parry"
        front-armour-label: "Armour"
        front-attribute-label: "Attribute level"
        front-proficiencies-label: "Combat proficiencies"
        front-abilities-label: "Fell abilities"

    properties:
      name:
        slot: [front-title, back-title]
        sample:
          de: "Moorschlurfer"
          en: "Bog shambler"

      # A stat block has no room for a source line; the note keeps it.
      reference:
        slot: ~

      description:
        sample:
          de: "Was im Moor versinkt, kommt nicht immer als das wieder herauf, was es war."
          en: "What sinks in the bog does not always come back up as what it was."

      features:
        slot: front-features
        aliases: [merkmale]
        description:
          de: "Markante Merkmale — eine kurze Liste im Text, etwa „Rachsüchtig, Widerspenstig“."
          en: "Distinctive features — a short list in the text, \"Vengeful, Unruly\" say."
        sample:
          de: "Zäh, Geduldig"
          en: "Tough, Patient"

      endurance:
        slot: front-endurance
        aliases: [ausdauer]
        description:
          de: "Ausdauer — die Lebenskraft; bei 0 ist der Widersacher besiegt."
          en: "Endurance — the life force; at 0 the adversary is defeated."
        sample: 20

      might:
        slot: front-might
        aliases: [stärke, staerke]
        description:
          de: "Stärke — wie leicht Treffer zu Schweren Treffern werden."
          en: "Might — how readily hits become Heavy Blows."
        sample: 2

      hate:
        slot: front-hate
        aliases: [hass]
        description:
          de: "Hass — das dunkle Gegenstück zur Hoffnung, treibt Grausame Fähigkeiten an. Widersacher ohne Hass haben Entschlossenheit."
          en: "Hate — the dark counterpart of Hope, fuelling Fell Abilities. An adversary without Hate has Resolve."
        sample: 4

      resolve:
        slot: front-resolve
        aliases: [entschlossenheit]
        description:
          de: "Entschlossenheit — der Vorrat für Moralproben, bei Tieren und freien Völkern statt Hass."
          en: "Resolve — the pool for morale checks, on beasts and free peoples in place of Hate."

      parry:
        slot: front-parry
        aliases: [parade]
        description:
          de: "Parade — Modifikator auf den Schwierigkeitsgrad im Nahkampf, z. B. „+1“; „–“ ohne."
          en: "Parry — modifier to the target number in melee, e.g. \"+1\"; \"–\" for none."
        sample: "+1"

      armor:
        slot: front-armour
        aliases: [armour, rüstung, ruestung]
        description:
          de: "Rüstung — die Schutzwürfel gegen Durchbohrende Treffer."
          en: "Armour — the protection dice against Piercing Blows."
        sample: 2

      attribute-level:
        slot: front-attribute
        aliases: [attributsstufe, attributwert]
        description:
          de: "Attributsstufe — der eine Wert für die Proben des Widersachers, im großen Diamanten."
          en: "Attribute level — the one value for the adversary's rolls, in the large diamond."
        sample: 3

      combat-proficiencies:
        slot: front-proficiencies
        aliases: [kampffähigkeiten, kampffaehigkeiten]
        description:
          de: "Kampffähigkeiten als Liste — je Eintrag die Waffe, der Wert in Erfolgswürfeln und in Klammern Schaden/Verletzung, ggf. ein Sondereffekt."
          en: "Combat proficiencies as a list — each entry the weapon, its value in Success Dice and in brackets damage/injury, a special effect if any."
        sample:
          de:
            - "Klauen 2 (4/14)"
            - "Umklammern 3 (2/12, Festhalten)"
          en:
            - "Claws 2 (4/14)"
            - "Grasp 3 (2/12, Seize)"

      fell-abilities:
        slot: front-abilities
        aliases: [grausame-fähigkeiten, grausame-faehigkeiten]
        description:
          de: "Grausame Fähigkeiten als Liste — je Eintrag der Name kursiv, dann die Wirkung (Markdown; ein Zeilenumbruch bleibt einer)."
          en: "Fell abilities as a list — each entry its name in italics, then the effect (markdown; a line break stays one)."
        sample:
          de:
            - "_Zäh._ Ein Schwerer Treffer kostet den Moorschlurfer nur die Hälfte."
          en:
            - "_Tough._ A Heavy Blow costs the bog shambler only half."
