id: troubleshooters
name: "The Troubleshooters"

# Modelled on the rulebook's layout: a white body in a coloured frame with
# the title in white small capitals on the frame's strip, sky-blue captions,
# orange list markers, and the game's slanted comic-lettering logo on the
# back. Lora for the display, a plain sans for the text, Bangers for the
# logo. Bilingual, German first; the notes are German and the captions
# come in both. The sample values are invented.
#
# Three card types: a gear kit — borderless on white, the picture large,
# the kit's contents and its traits, the story points; a mechanic — a rule
# in an orange frame, the prose and its bullet points; a director
# character in the game's blue, the three numbers on one line, the attacks
# and the skills as lists, the picture on the back where there is one.
languages: [de, en]

stylesheet: styles/troubleshooters.css

partial-templates:
  logo: templates/logo.hbs
  # The mechanic's back, and the character's when there is no picture.
  back: templates/back.hbs

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, titel]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  reference:
    slot: front-footer
    aliases: [buch, quelle, referenz]
    description:
      de: "Quellenangabe — Regelbuchseite oder Wikilink, klein am Fuß."
      en: "Source reference — rulebook page or wikilink, small at the foot."
    sample:
      de: "Regelbuch S. 130"
      en: "Rulebook p. 130"

  # Bound where a face shows it: the front of a gear kit, the back of a
  # character.
  image:
    aliases: [bild]
    description:
      de: "Bild der Karte — ein Wikilink auf ein Bild im Vault."
      en: "The card's picture — a wikilink to a picture in the vault."

translations:
  de:
    back-label: "Troubleshooters"
    back-logo-the: "THE"
    back-logo-name: "TROUBLESHOOTERS"
    back-logo-name-1: "TROUBLE-"
    back-logo-name-2: "SHOOTERS"
  en:
    back-label: "Troubleshooters"
    back-logo-the: "THE"
    back-logo-name: "TROUBLESHOOTERS"
    back-logo-name-1: "TROUBLE-"
    back-logo-name-2: "SHOOTERS"

card-types:
  gear:     card-types/gear.yaml
  mechanic: card-types/mechanic.yaml
  npc:      card-types/npc.yaml
