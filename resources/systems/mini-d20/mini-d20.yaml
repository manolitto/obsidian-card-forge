id: mini-d20
name: "MINI D20"

# Modelled on the MINI D20 rulebook (Seba, kritischerfehlschlag.de): white
# paper, black ink, a brick-red hairline under table heads and along the
# card's foot, the stacked red "MiNI / D20" wordmark on the back, Merriweather
# for the text and a wedge-serif display face for the titles. No ornament
# beyond that — the book has none. Bilingual: every caption in German and
# English, and the sample values in both.
#
# Eight card types. Six of them share one header — a small icon in each top
# corner, the name between them, the card type's label under the left icon
# and a sub-type under the right — and one back, the wordmark between the
# same two icons. The left icon is the card type's own, a property with a
# default; the right one is DERIVED from what the card is about (the
# archetype, the creature's category, the equipment's kind, the people's
# name) through a classifier whose tokens are the icons' paths. The cover
# and the generic card have faces of their own.
#
# The icons are game-icons.net's, CC BY 3.0 — assets/icons/NOTICE.md names
# every file and its artist. Number and noun that belong together are
# joined with a non-breaking space in the sample values ("5 GM", "Stufe 4",
# "+ 4 TP"): the cards are dense, and a break inside such a pair is what the
# eye trips over.
languages: [de, en]

stylesheet: styles/mini-d20.css

partial-templates:
  header: templates/header.hbs
  footer: templates/footer.hbs
  tags: templates/tags.hbs
  flavour: templates/flavour.hbs
  wordmark: templates/wordmark.hbs

# The stat blocks are lean and most cards fit their front; a long one fills
# the back — a wordmark, not a designed face that would be missed — before
# it spawns a card. The cover and the generic card say otherwise below.
overflow-mode: back-then-cards

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, anzeigename]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  description:
    slot: front-text
    aliases: [beschreibung, flavour, flavor, flavortext]
    description:
      de: "Stimmungstext oder Kurzbeschreibung — eine kursive Zeile am Fuß der Karte."
      en: "Flavour or a short description — an italic line at the foot of the card."
    sample:
      de: "Eine schlanke, einhändige Klinge aus geschmiedetem Stahl."
      en: "A slender, one-handed blade of forged steel."

  image:
    slot: front-image
    aliases: [bild]
    description:
      de: "Bild der Karte als Wikilink (`[[Bild.png]]`), Embed (`![[Bild.png]]`) oder Dateiname. Steht zwischen den Werten und dem Stimmungstext und nimmt den Platz, der bleibt."
      en: "The card's picture as a wikilink (`[[image.png]]`), embed (`![[image.png]]`) or file name. Sits between the stats and the flavour and takes the room that is left."
    sample: "[[Gegenstand.png]]"

  reference:
    slot: front-footer
    aliases: [referenz, quelle, buch]
    description:
      de: "Quellenangabe — Regelwerkseite oder Wikilink, klein unter der roten Linie am Fuß."
      en: "Source reference — rulebook page or wikilink, small under the red line at the foot."
    sample:
      de: "Regelwerk S. 16"
      en: "Rules p. 16"

# The strings the shared faces read that are not a place's caption.
translations:
  de:
    back-wordmark-line-1: "MiNI"
    back-wordmark-line-2: "D20"
    back-tagline: "Ein Rollenspiel von Seba"
  en:
    back-wordmark-line-1: "MiNI"
    back-wordmark-line-2: "D20"
    back-tagline: "A Roleplaying Game by Seba"

card-types:
  # ── ability ─────────────────────────────────────────────────────────
  # One card per archetype ability (rulebook pp. 10–13): the archetype it
  # belongs to under the right icon, the tags as pills, the rule under
  # "Wirkung", and notes on what a tag means for this archetype.
  ability:
    front-template: templates/ability-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/ability.css

    # The right icon and the back's lower icon follow the archetype.
    classifiers:
      front-icon-right: &archetype-icons
        match:
          - { pattern: "schurk|rogue|thief", token: assets/icons/hood.svg }
          - { pattern: "kämpfer|kampfer|fighter|krieger|warrior", token: assets/icons/spartan-helmet.svg }
          - { pattern: "kleriker|cleric|priest|priester", token: assets/icons/prayer.svg }
          - { pattern: "magier|mage|zauber|wizard|hexe", token: assets/icons/pointy-hat.svg }
      back-icon-bottom: *archetype-icons

    translations:
      de:
        card-type-label: "Fähigkeit"
        back-label: "Fähigkeit"
        front-effect-label: "Wirkung"
      en:
        card-type-label: "Ability"
        back-label: "Ability"
        front-effect-label: "Effect"

    properties:
      icon:
        slot: [front-icon-left, back-icon-top]
        default: assets/icons/skills.svg
        description:
          de: "Das Symbol des Kartentyps, links oben und groß auf der Rückseite — ein Pfad unter dem System. Voreingestellt; nur setzen, wenn ein anderes gebündeltes Symbol gemeint ist."
          en: "The card type's icon, top left and large on the back — a path under the system. Preset; set it only for another bundled icon."

      archetype:
        slot: [front-subtype, front-icon-right, back-icon-bottom, back-subtype]
        aliases: [klasse, class, archetyp]
        description:
          de: "Archetyp, zu dem die Fähigkeit gehört — Schurk:in, Kämpfer:in, Kleriker:in oder Magier:in, gern als Wikilink. Steht unter dem rechten Symbol und wählt es."
          en: "Archetype the ability belongs to — Rogue, Fighter, Cleric or Mage, a wikilink if you like. Stands under the right icon and picks it."
        sample:
          de: "[[Schurk:in]]"
          en: "[[Rogue]]"

      tags:
        slot: front-tags
        aliases: [merkmale, schlagworte]
        description:
          de: "Schlagworte als Pillen — „Aktiv“, „Passiv“, „Nahkampf“, „Fernkampf“, „Zauber“, „Geschoss“. Ein bis drei sind üblich."
          en: "Tags as pills — \"Active\", \"Passive\", \"Melee\", \"Ranged Combat\", \"Spell\", \"Projectile\". One to three are usual."
        sample:
          de: ["Aktiv", "Fernkampf"]
          en: ["Active", "Ranged Combat"]

      effect:
        slot: front-effect
        aliases: [wirkung, effekt, regel, rule, text]
        description:
          de: "Regeltext der Fähigkeit — was sie tut (Markdown)."
          en: "The ability's rule — what it does (markdown)."
        sample:
          de: "Du kannst mit einer Fernkampfwaffe bis zu drei Ziele mit einer Aktion angreifen."
          en: "With a ranged weapon you can attack up to three targets with one action."

      tag-description:
        slot: front-notes
        aliases: [tag-descriptions, tag-erklärung, tag-erklaerung, tag-notizen]
        description:
          de: "Erklärungen einzelner Schlagworte als Liste einzelner Paare (`{ Aktiv: … }`) — etwa wie oft „Aktiv“ bei einem Kleriker wirkt. Steht klein unter der Wirkung."
          en: "Explanations of single tags as a list of single-key pairs (`{ Active: … }`) — how often \"Active\" triggers for a cleric, say. Set small under the effect."
        sample:
          de:
            - { Aktiv: "Zweimal täglich je Charakterstufe." }
            - { Zauber: "Bei allen Zaubern zählt die Fertigkeit Arkanes als Bonus." }
          en:
            - { Active: "Twice per day per character level." }
            - { Spell: "For every spell, add your Arcana skill as a bonus." }

  # ── archetype ───────────────────────────────────────────────────────
  # One card per archetype: the motto, the level-1 stat block, the skill
  # bonuses in two columns, the allowed gear, the starting abilities and
  # the level-up rule.
  archetype:
    front-template: templates/archetype-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/archetype.css

    # The right icon follows the archetype's own name.
    classifiers:
      front-icon-right: *archetype-icons
      back-icon-bottom: *archetype-icons

    translations:
      de:
        card-type-label: "Archetyp"
        back-label: "Archetyp"
        front-stat-1-label: "TP"
        front-stat-2-label: "RK"
        front-stat-3-label: "RW"
        front-skills-label: "Fertigkeitsboni"
        front-armor-label: "Erlaubte Rüstungen"
        front-weapons-label: "Erlaubte Waffen"
        front-abilities-label: "Fähigkeiten"
        front-level-up-label: "Stufenaufstieg"
      en:
        card-type-label: "Archetype"
        back-label: "Archetype"
        front-stat-1-label: "HP"
        front-stat-2-label: "AC"
        front-stat-3-label: "ST"
        front-skills-label: "Skill bonuses"
        front-armor-label: "Allowed armor"
        front-weapons-label: "Allowed weapons"
        front-abilities-label: "Abilities"
        front-level-up-label: "Level-up"

    properties:
      icon:
        slot: [front-icon-left, back-icon-top]
        default: assets/icons/character.svg
        description:
          de: "Das Symbol des Kartentyps, links oben und groß auf der Rückseite — ein Pfad unter dem System. Voreingestellt."
          en: "The card type's icon, top left and large on the back — a path under the system. Preset."

      name:
        slot: [front-title, front-icon-right, back-icon-bottom, back-subtype]
        description:
          de: "Name des Archetyps — Schurk:in, Kämpfer:in, Kleriker:in, Magier:in. Wählt zugleich das rechte Symbol."
          en: "The archetype's name — Rogue, Fighter, Cleric, Mage. Picks the right icon as well."
        sample:
          de: "Schurk:in"
          en: "Rogue"

      tagline:
        slot: front-tagline
        aliases: [untertitel, motto, subtitle]
        description:
          de: "Kurze Charakterisierung — ein Satz oder Motto unter dem Namen."
          en: "A short characterisation — one sentence or a motto under the name."
        sample:
          de: "Es gibt immer einen Weg"
          en: "There is always a way"

      hit-points:
        slot: front-stat-1
        aliases: [tp, trefferpunkte, hp]
        description:
          de: "Trefferpunkte (TP) auf Stufe 1."
          en: "Hit Points (HP) at level 1."
        sample: 12

      armor-class:
        slot: front-stat-2
        aliases: [rk, rüstungsklasse, ruestungsklasse, ac]
        description:
          de: "Rüstungsklasse (RK) auf Stufe 1, ohne Rüstung."
          en: "Armor Class (AC) at level 1, without armor."
        sample: 10

      saving-throw:
        slot: front-stat-3
        aliases: [rw, rettungswurf, st, save]
        description:
          de: "Rettungswurf (RW) — Zielwert auf Stufe 1."
          en: "Saving Throw (ST) — the target at level 1."
        sample: 11

      skill-bonuses:
        slot: front-skills
        aliases: [fertigkeitsboni, fertigkeitsbonus, skills, fertigkeiten]
        description:
          de: "Anfängliche Fertigkeitsboni als Liste einzelner Paare (`{ Fertigkeit: Bonus }`), in zwei Spalten gesetzt."
          en: "Starting skill bonuses as a list of single-key pairs (`{ Skill: bonus }`), set in two columns."
        sample:
          de:
            - { Heimlichkeit: "+4" }
            - { Fingerfertigkeit: "+4" }
            - { Akrobatik: "+3" }
            - { Wahrnehmung: "+3" }
            - { Fernkampf: "+2" }
            - { Nahkampf: "+2" }
          en:
            - { Stealth: "+4" }
            - { Dexterity: "+4" }
            - { Acrobatics: "+3" }
            - { Perception: "+3" }
            - { "Ranged Combat": "+2" }
            - { Melee: "+2" }

      allowed-armor:
        slot: front-armor
        aliases: [erlaubte-rüstungen, erlaubte-ruestungen]
        description:
          de: "Erlaubte Rüstungen (Leicht / Mittel / Schwer / Alle), eine Liste."
          en: "Allowed armor (Light / Medium / Heavy / All), a list."
        sample:
          de: ["Mittel"]
          en: ["Medium"]

      allowed-weapons:
        slot: front-weapons
        aliases: [erlaubte-waffen]
        description:
          de: "Erlaubte Waffen (Leicht / Mittel / Schwer / Alle), eine Liste."
          en: "Allowed weapons (Light / Medium / Heavy / All), a list."
        sample:
          de: ["Mittel"]
          en: ["Medium"]

      initial-abilities:
        slot: front-abilities
        aliases: [fähigkeiten, faehigkeiten, abilities, anfangsfähigkeiten]
        description:
          de: "Die Regel zu den Anfangsfähigkeiten als Liste einzelner Zeilen — wie viele zu Beginn, und was für diesen Archetyp gilt."
          en: "The starting-abilities rule as a list of lines — how many at level 1, and what applies to this archetype."
        sample:
          de: ["Du startest mit zwei Fähigkeiten."]
          en: ["You start with two abilities."]

      level-up-rules:
        slot: front-level-up
        aliases: [stufenaufstieg, level-up, aufstieg, progression]
        description:
          de: "Der Stufenaufstieg als Liste einzelner Regeln — TP und RW je Stufe, Fertigkeitspunkte und Fähigkeiten."
          en: "The level-up rule as a list of lines — HP and ST per level, skill points and abilities."
        sample:
          de:
            - "+ 4 TP pro Stufe."
            - "- 1 RW pro Stufe."
            - "Bei jedem Stufenaufstieg bis Stufe 4 erhältst du 5 Fertigkeitspunkte und eine weitere Fähigkeit."
          en:
            - "+ 4 HP per level."
            - "- 1 ST per level."
            - "On each level-up through level 4 you gain 5 skill points and one more ability."

  # ── bestiary ────────────────────────────────────────────────────────
  # The rulebook's two-row stat block (pp. 19–23): six columns — TW TP RK
  # RW BW A — then the special abilities, one line each.
  bestiary:
    front-template: templates/bestiary-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/bestiary.css

    # The right icon follows the creature's category.
    classifiers:
      front-icon-right: &category-icons
        match:
          - { pattern: "humanoid", token: assets/icons/cowled.svg }
          - { pattern: "\\btier\\b|animal|beast", token: assets/icons/paw-print.svg }
          - { pattern: "untot|undead", token: assets/icons/death-skull.svg }
          - { pattern: "monster", token: assets/icons/beast-eye.svg }
      back-icon-bottom: *category-icons

    translations:
      de:
        card-type-label: "Bestiarium"
        back-label: "Bestiarium"
        front-stat-1-label: "TW"
        front-stat-2-label: "TP"
        front-stat-3-label: "RK"
        front-stat-4-label: "RW"
        front-stat-5-label: "BW"
        front-stat-6-label: "A"
        front-abilities-label: "Fähigkeiten"
      en:
        card-type-label: "Bestiary"
        back-label: "Bestiary"
        front-stat-1-label: "HD"
        front-stat-2-label: "HP"
        front-stat-3-label: "AC"
        front-stat-4-label: "ST"
        front-stat-5-label: "MV"
        front-stat-6-label: "A"
        front-abilities-label: "Abilities"

    properties:
      icon:
        slot: [front-icon-left, back-icon-top]
        default: assets/icons/claw-slashes.svg
        description:
          de: "Das Symbol des Kartentyps, links oben und groß auf der Rückseite — ein Pfad unter dem System. Voreingestellt."
          en: "The card type's icon, top left and large on the back — a path under the system. Preset."

      category:
        slot: [front-subtype, front-icon-right, back-icon-bottom, back-subtype]
        aliases: [kategorie, gattung]
        description:
          de: "Kategorie laut Bestiarium — Humanoid, Tier, Monster oder Untot. Steht unter dem rechten Symbol und wählt es."
          en: "Bestiary category — Humanoid, Animal, Monster or Undead. Stands under the right icon and picks it."
        sample:
          de: "Humanoid"
          en: "Humanoid"

      hit-dice:
        slot: front-stat-1
        aliases: [tw, trefferwürfel, trefferwuerfel, hd]
        description:
          de: "Trefferwürfel (TW) — zugleich der Angriffsbonus."
          en: "Hit Dice (HD) — the attack bonus as well."
        sample: 1

      hit-points:
        slot: front-stat-2
        aliases: [tp, trefferpunkte, hp]
        description:
          de: "Trefferpunkte (TP), ein fester Wert — MINI D20 würfelt sie nicht."
          en: "Hit Points (HP), a fixed value — MINI D20 does not roll them."
        sample: 5

      armor-class:
        slot: front-stat-3
        aliases: [rk, rüstungsklasse, ruestungsklasse, ac]
        description:
          de: "Rüstungsklasse (RK) als eine Zahl."
          en: "Armor Class (AC) as one number."
        sample: 13

      saving-throw:
        slot: front-stat-4
        aliases: [rw, rettungswurf, st, save]
        description:
          de: "Rettungswurf (RW) — der Zielwert auf dem W20."
          en: "Saving Throw (ST) — the target on the d20."
        sample: 18

      movement:
        slot: front-stat-5
        aliases: [bw, bewegung, bewegungsrate, mv, move]
        description:
          de: "Bewegung (BW) — Felder je Runde; meist 1."
          en: "Movement (MV) — zones per turn; usually 1."
        sample: 1

      actions:
        slot: front-stat-6
        aliases: [a, aktionen, attacks, angriffe]
        description:
          de: "Aktionen (A) — die Angriffe mit Schaden, z. B. „1 Waffe (4 Schaden)“ oder „2 Klauen (3 Schaden)“."
          en: "Actions (A) — the attacks with their damage, e.g. \"1 Weapon (4 Damage)\" or \"2 Claws (3 Damage)\"."
        sample:
          de: "1 Waffe (4 Schaden)"
          en: "1 Weapon (4 Damage)"

      abilities:
        slot: front-abilities
        aliases: [fähigkeiten, faehigkeiten, sonderfähigkeiten]
        description:
          de: "Sonderfähigkeiten als Liste, eine Zeile je Eintrag (Markdown)."
          en: "Special abilities as a list, one line per entry (markdown)."
        sample:
          de: ["Im Sonnenlicht Angriffswurf minus 1."]
          en: ["In sunlight the attack roll is reduced by 1."]

  # ── equipment ───────────────────────────────────────────────────────
  # The rulebook's equipment tables (pp. 16–18): the kind under the right
  # icon, a short label / value block, the effect of a general item or
  # artefact, a note.
  equipment:
    front-template: templates/equipment-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/equipment.css

    # The right icon follows the kind of equipment.
    classifiers:
      front-icon-right: &equipment-icons
        match:
          - { pattern: "waffe|weapon", token: assets/icons/crossed-swords.svg }
          - { pattern: "rüstung|rustung|armou?r", token: assets/icons/breastplate.svg }
          - { pattern: "artefakt|artifact|magisch|magic", token: assets/icons/gem-pendant.svg }
          - { pattern: "schatz|treasure|hort|loot", token: assets/icons/locked-chest.svg }
          - { pattern: "allgemein|general", token: assets/icons/swap-bag.svg }
      back-icon-bottom: *equipment-icons

    translations:
      de:
        card-type-label: "Ausrüstung"
        back-label: "Ausrüstung"
        front-style-label: "Art"
        front-damage-label: "Grundschaden"
        front-reach-label: "Reichweite"
        front-ac-modifier-label: "RK-Modifikator"
        front-price-label: "Preis"
        front-effect-label: "Wirkung"
        front-notes-label: "Anmerkungen"
      en:
        card-type-label: "Equipment"
        back-label: "Equipment"
        front-style-label: "Style"
        front-damage-label: "Base damage"
        front-reach-label: "Reach"
        front-ac-modifier-label: "AC-Modification"
        front-price-label: "Price"
        front-effect-label: "Effect"
        front-notes-label: "Notes"

    properties:
      icon:
        slot: [front-icon-left, back-icon-top]
        default: assets/icons/knapsack.svg
        description:
          de: "Das Symbol des Kartentyps, links oben und groß auf der Rückseite — ein Pfad unter dem System. Voreingestellt."
          en: "The card type's icon, top left and large on the back — a path under the system. Preset."

      equipment-type:
        slot: [front-subtype, front-icon-right, back-icon-bottom, back-subtype]
        aliases: [art, typ, gegenstandstyp, kategorie, type, category]
        description:
          de: "Art des Gegenstands — Waffe, Rüstung, Allgemein, Magisches Artefakt, Schatz. Steht unter dem rechten Symbol und wählt es."
          en: "Kind of equipment — Weapon, Armor, General, Magical Artifact, Treasure. Stands under the right icon and picks it."
        sample:
          de: "Waffe"
          en: "Weapon"

      style:
        slot: front-style
        aliases: [stil]
        description:
          de: "Untertyp laut Tabelle — Leicht, Mittel, Schwer bei Rüstung; die Waffenart bei Waffen."
          en: "Subtype per the table — Light, Medium, Heavy for armor; the weapon's style for weapons."
        sample:
          de: "Mittel"
          en: "Medium"

      damage:
        slot: front-damage
        aliases: [grundschaden, schaden, dmg]
        description:
          de: "Grundschaden der Waffe als Zahl — MINI D20 würfelt keinen Schaden."
          en: "The weapon's base damage as a number — MINI D20 does not roll damage."
        sample: 4

      reach:
        slot: front-reach
        aliases: [reichweite, range]
        description:
          de: "Reichweite — Nah, Mittel, Fern, oder „Nah+Mittel“."
          en: "Reach — Close, Medium, Far, or \"Close+Medium\"."
        sample:
          de: "Nah"
          en: "Close"

      ac-modifier:
        slot: front-ac-modifier
        aliases: [rk-modifikator, rk-mod, ac-mod]
        description:
          de: "RK-Modifikator — der Bonus auf die Rüstungsklasse durch diese Rüstung."
          en: "AC modification — the bonus to Armor Class from this armor."
        sample: "+ 4"

      price:
        slot: front-price
        aliases: [preis, kosten, cost]
        description:
          de: "Preis in Goldmünzen, z. B. „15 GM“; „—“ wenn kostenlos."
          en: "Price in gold pieces, e.g. \"15 GP\"; \"—\" if free."
        sample:
          de: "15 GM"
          en: "15 GP"

      effect:
        slot: front-effect
        aliases: [effekt, wirkung]
        description:
          de: "Spielwirkung — bei allgemeiner Ausrüstung und magischen Artefakten (Markdown)."
          en: "The mechanical effect — for general gear and magical artefacts (markdown)."
        sample:
          de: "Heilt 10 TP."
          en: "Heals 10 HP."

      notes:
        slot: front-notes
        aliases: [notizen, anmerkungen]
        description:
          de: "Zusätzliche Hinweise oder Bedingungen."
          en: "Additional notes or conditions."

  # ── heritage ────────────────────────────────────────────────────────
  # The rulebook's peoples (p. 14): the tags as pills, the one passive
  # trait, a table of example names. The right icon follows the people's
  # own name.
  heritage:
    front-template: templates/heritage-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/heritage.css

    classifiers:
      front-icon-right: &heritage-icons
        match:
          - { pattern: "zwerg|dwarf", token: assets/icons/dwarf-face.svg }
          - { pattern: "elf", token: assets/icons/elf-ear.svg }
          - { pattern: "halbling|halfling", token: assets/icons/barefoot.svg }
          - { pattern: "gnom|gnome", token: assets/icons/wizard-face.svg }
          - { pattern: "ork|orc", token: assets/icons/orc-head.svg }
          - { pattern: "mensch|human", token: assets/icons/person.svg }
      back-icon-bottom: *heritage-icons

    translations:
      de:
        card-type-label: "Volk"
        back-label: "Volk"
        front-effect-label: "Eigenschaft"
        front-names-label: "Namen"
        front-names-male-label: "Männlich"
        front-names-female-label: "Weiblich"
        front-names-lastname-label: "Nachname"
      en:
        card-type-label: "Heritage"
        back-label: "Heritage"
        front-effect-label: "Trait"
        front-names-label: "Names"
        front-names-male-label: "Male"
        front-names-female-label: "Female"
        front-names-lastname-label: "Last name"

    properties:
      icon:
        slot: [front-icon-left, back-icon-top]
        default: assets/icons/family-tree.svg
        description:
          de: "Das Symbol des Kartentyps, links oben und groß auf der Rückseite — ein Pfad unter dem System. Voreingestellt."
          en: "The card type's icon, top left and large on the back — a path under the system. Preset."

      name:
        slot: [front-title, front-icon-right, back-icon-bottom]
        description:
          de: "Name des Volkes — Zwerg:in, Elf:e, Halbling:in, Gnom:in, Ork:in, Mensch. Wählt zugleich das rechte Symbol."
          en: "The people's name — Dwarf, Elf, Halfling, Gnome, Orc, Human. Picks the right icon as well."
        sample:
          de: "Zwerg:in"
          en: "Dwarf"

      tags:
        slot: front-tags
        aliases: [merkmale, schlagworte]
        description:
          de: "Schlagworte als Pillen — meist „Passiv“."
          en: "Tags as pills — usually \"Passive\"."
        sample:
          de: ["Passiv"]
          en: ["Passive"]

      effect:
        slot: front-effect
        aliases: [wirkung, effekt, eigenschaft, trait, regel, rule, text]
        description:
          de: "Die Eigenschaft, die dieses Volk mitbringt (Markdown)."
          en: "The trait this people brings (markdown)."
        sample:
          de: "+ 1 Grundschaden im Nahkampf."
          en: "+ 1 base damage in melee."

      names:
        slot: front-names
        aliases: [namen, namensbeispiele]
        description:
          de: "Namensbeispiele als Liste von Zeilen mit `male`, `female` und `lastname`."
          en: "Example names as a list of rows with `male`, `female` and `lastname`."
        sample:
          de:
            - { male: "Artex", female: "Branca", lastname: "Donnerhammer" }
            - { male: "Grimthor", female: "Opal", lastname: "Kupferauge" }
          en:
            - { male: "Artex", female: "Branca", lastname: "Thunderhammer" }
            - { male: "Grimthor", female: "Opal", lastname: "Coppereye" }

  # ── quirk ───────────────────────────────────────────────────────────
  # One card per entry of the rulebook's rolled quirks table: the roll as
  # a badge where the right icon would be, the quirk's text as the body.
  quirk:
    front-template: templates/quirk-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/quirk.css

    translations:
      de:
        card-type-label: "Eigenheit"
        back-label: "Eigenheit"
      en:
        card-type-label: "Quirk"
        back-label: "Quirk"

    properties:
      icon:
        slot: [front-icon-left, back-icon-top]
        default: assets/icons/portrait.svg
        description:
          de: "Das Symbol des Kartentyps, links oben und groß auf der Rückseite — ein Pfad unter dem System. Voreingestellt."
          en: "The card type's icon, top left and large on the back — a path under the system. Preset."

      roll:
        slot: front-roll
        description:
          de: "Der Wurf, unter dem die Eigenheit in der Tabelle steht — als Abzeichen rechts oben."
          en: "The roll the quirk is listed under — a badge at the top right."
        sample: "7"

      description:
        aliases: [beschreibung, text, eigenheit]
        description:
          de: "Die Eigenheit — der Text der Karte (Markdown)."
          en: "The quirk — the card's text (markdown)."
        sample:
          de: "Du sprichst von dir stets in der dritten Person und vergisst nie einen Namen."
          en: "You always speak of yourself in the third person and never forget a name."

  # ── cover ───────────────────────────────────────────────────────────
  # A deck's title page, its back the licences and acknowledgements: the
  # note's own text, under a heading. A long list runs onto further cards
  # rather than over the cover's front.
  cover:
    front-template: templates/cover-front.hbs
    back-template: templates/cover-back.hbs
    stylesheet: styles/cover.css
    overflow-mode: extra-cards

    translations:
      de:
        back-label: "Deckblatt"
        back-heading: "Lizenzen & Danksagungen"
      en:
        back-label: "Cover"
        back-heading: "Licences & Acknowledgements"

    properties:
      name:
        description:
          de: "Titel des Decks, groß auf der Vorderseite."
          en: "The deck's title, large on the front."
        sample:
          de: "Drachenhort-Kampagne"
          en: "Dragonhoard Campaign"

      subtitle:
        slot: front-tagline
        aliases: [untertitel, motto, tagline]
        description:
          de: "Kleiner kursiver Untertitel unter dem Titel."
          en: "A small italic subtitle under the title."
        sample:
          de: "Ein Kartendeck für MINI D20"
          en: "A card deck for MINI D20"

      footer:
        slot: front-footer
        aliases: [version, edition, datum, date]
        description:
          de: "Dezente Fußzeile der Vorderseite — Ausgabe, Datum, Version."
          en: "A discreet footer on the front — edition, date, version."
        sample:
          de: "Ausgabe 1 · 2026"
          en: "Edition 1 · 2026"

      image:
        description:
          de: "Titelbild als Wikilink; ohne Angabe steht dort der MiNI-D20-Schriftzug."
          en: "Cover art as a wikilink; without it the MiNI D20 wordmark stands there."
        sample: "[[Deckblatt.png]]"

      reference:
        slot: ~

      description:
        slot: ~

      body:
        slot: back-text
        description:
          de: "Der Text der Notiz vor der ersten `##`-Überschrift — die Lizenzen und Danksagungen der Rückseite. `###`-Überschriften gliedern ihn."
          en: "The note's text before its first `##` heading — the back's licences and acknowledgements. `###` headings structure it."

  # ── generic ─────────────────────────────────────────────────────────
  # A free card: a title, a subtitle and a footer on either face when the
  # note gives them, any of the bundled icons in the corners, and a body
  # of markdown — written in the block or as a `## Vorderseite` /
  # `## Rückseite` section of the note. A back with nothing set is the
  # wordmark back.
  generic:
    front-template: templates/generic-front.hbs
    back-template: templates/generic-back.hbs
    stylesheet: styles/generic.css
    overflow-mode: extra-cards

    translations:
      de:
        back-label: ""
      en:
        back-label: ""

    properties:
      name:
        slot: ~
      image:
        slot: ~
      reference:
        slot: ~
      description:
        slot: ~

      title:
        slot: front-title
        aliases: [front-title, titel, überschrift, heading]
        description:
          de: "Titel der Vorderseite."
          en: "The front's title."
        sample:
          de: "Hausregel"
          en: "House Rule"

      subtitle:
        slot: front-tagline
        aliases: [front-subtitle, untertitel]
        description:
          de: "Kursiver Untertitel der Vorderseite."
          en: "The front's italic subtitle."
        sample:
          de: "Optionale Regel"
          en: "Optional rule"

      content:
        slot: front-text
        aliases: [front-content, front-text, vordertext, vorderseite, front]
        description:
          de: "Text der Vorderseite (Markdown) — im Block, oder als Abschnitt `## Vorderseite` der Notiz."
          en: "The front's text (markdown) — in the block, or as a `## Front` section of the note."
        sample:
          de: "Beschreibe hier die Regel …"
          en: "Describe the rule here …"

      footer:
        slot: front-footer
        aliases: [front-footer, front-reference, vorder-fußzeile]
        description:
          de: "Fußzeile der Vorderseite, unter der roten Linie."
          en: "The front's footer, under the red line."
        sample:
          de: "Regelwerk S. 12"
          en: "Rules p. 12"

      icon-left:
        slot: front-icon-left
        aliases: [front-icon-left, front-icon, vorder-symbol-links]
        description:
          de: "Symbol links oben — ein Pfad unter dem System, z. B. `assets/icons/skills.svg`."
          en: "The top-left icon — a path under the system, e.g. `assets/icons/skills.svg`."
        sample: "assets/icons/skills.svg"

      label-left:
        slot: front-type-label
        aliases: [front-icon-left-label, front-label-left, vorder-label-links]
        description:
          de: "Kleine Kapitälchen über dem linken Symbol — etwa ein Kartentyp."
          en: "Small caps above the left icon — a card type, say."
        sample:
          de: "Fähigkeit"
          en: "Ability"

      icon-right:
        slot: front-icon-right
        aliases: [front-icon-right, vorder-symbol-rechts]
        description:
          de: "Symbol rechts oben — ein Pfad unter dem System, z. B. `assets/icons/hood.svg`."
          en: "The top-right icon — a path under the system, e.g. `assets/icons/hood.svg`."

      label-right:
        slot: front-subtype
        aliases: [front-icon-right-label, front-label-right, vorder-label-rechts]
        description:
          de: "Kleine Kapitälchen über dem rechten Symbol — etwa ein Untertyp."
          en: "Small caps above the right icon — a sub-type, say."

      back-heading:
        slot: back-title
        aliases: [back-title, rücktitel]
        description:
          de: "Titel der Rückseite. Mit Titel, Untertitel, Text oder Fußzeile wird die Rückseite eine zweite Textseite statt der Schriftzug-Rückseite."
          en: "The back's title. With a title, subtitle, text or footer the back becomes a second text face instead of the wordmark back."

      back-subtitle:
        slot: back-tagline
        aliases: [rückuntertitel, back-subheading]
        description:
          de: "Kursiver Untertitel der Rückseite."
          en: "The back's italic subtitle."

      back-content:
        slot: back-text
        aliases: [back-text, rücktext, rückseite, back]
        description:
          de: "Text der Rückseite (Markdown) — im Block, oder als Abschnitt `## Rückseite` der Notiz."
          en: "The back's text (markdown) — in the block, or as a `## Back` section of the note."

      back-colophon:
        slot: back-footer
        aliases: [back-footer, back-reference, rück-fußzeile]
        description:
          de: "Fußzeile der Rückseite, unter der roten Linie."
          en: "The back's footer, under the red line."

      icon-upper:
        slot: back-icon-top
        aliases: [back-icon-top, rück-symbol-oben]
        description:
          de: "Symbol über dem Schriftzug der Rückseite — ein Pfad unter dem System."
          en: "The icon above the back's wordmark — a path under the system."

      label-upper:
        slot: back-type-label
        aliases: [back-icon-top-label, back-label-top, rück-label-oben]
        description:
          de: "Kapitälchen unter dem oberen Symbol der Rückseite."
          en: "Small caps under the back's top icon."

      icon-lower:
        slot: back-icon-bottom
        aliases: [back-icon-bottom, rück-symbol-unten]
        description:
          de: "Symbol unter dem Schriftzug der Rückseite — ein Pfad unter dem System."
          en: "The icon below the back's wordmark — a path under the system."

      label-lower:
        slot: back-subtype
        aliases: [back-icon-bottom-label, back-label-bottom, rück-label-unten]
        description:
          de: "Kapitälchen unter dem unteren Symbol der Rückseite."
          en: "Small caps under the back's bottom icon."
