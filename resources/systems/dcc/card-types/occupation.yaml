# ── occupation ──────────────────────────────────────────────────────
# One card per row of the 0-level occupation table: the roll, the
# occupation, its people where it has one, the trained weapon and the
# trade goods, each under a small-caps caption.

front-template: templates/occupation-front.hbs
back-template: templates/back.hbs
stylesheet: styles/occupation.css

translations:
  de:
    back-label: "Beruf"
    front-race-label: "Volk"
    front-weapon-label: "Geübte Waffe"
    front-goods-label: "Handelsware"
  en:
    back-label: "Occupation"
    front-race-label: "Race"
    front-weapon-label: "Trained weapon"
    front-goods-label: "Trade goods"

properties:
  name:
    sample:
      de: "Sterndeuter"
      en: "Stargazer"

  race:
    slot: front-race
    aliases: [volk]
    description:
      de: "Volk eines halbmenschlichen Berufs — Halbling, Zwerg, Elf. Nur wo eines gilt."
      en: "The people of a demi-human occupation — Halfling, Dwarf, Elf. Only where one applies."

  trained-weapon:
    slot: front-weapon
    aliases: [geübte-waffe, geuebte-waffe, waffe, weapon]
    description:
      de: "Die im Beruf geübte Waffe, mit ihrem Würfel — „Stab (1W4)“."
      en: "The weapon the occupation is trained in, with its die — \"Staff (1d4)\"."
    sample:
      de: "Stab (1W4)"
      en: "Staff (1d4)"

  trade-goods:
    slot: front-goods
    aliases: [handelsware, ware, goods]
    description:
      de: "Die Handelsware, die der Beruf zu Beginn mitbringt."
      en: "The trade goods the occupation starts with."
    sample:
      de: "Sternkarte"
      en: "Star chart"
