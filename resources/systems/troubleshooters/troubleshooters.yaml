id: troubleshooters
name: "The Troubleshooters"

# Modelled on the rulebook's layout: a white body in a coloured frame with
# the title in white small capitals on the frame's strip, sky-blue captions,
# orange list markers, and the game's slanted comic-lettering logo on the
# back. Lora for the display, a plain sans for the text, Bangers for the
# logo. Bilingual, German first; the notes are German and the captions
# come in both. The sample values are invented.
#
# Three card types: a gear kit — borderless on white, the picture large,
# the kit's contents and its traits, the story points; a mechanic — a rule
# in an orange frame, the prose and its bullet points; a director
# character in the game's blue, the three numbers on one line, the attacks
# and the skills as lists, the picture on the back where there is one.
languages: [de, en]

stylesheet: styles/troubleshooters.css

partial-templates:
  logo: templates/logo.hbs
  # The mechanic's back, and the character's when there is no picture.
  back: templates/back.hbs

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, titel]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  reference:
    slot: front-footer
    aliases: [buch, quelle, referenz]
    description:
      de: "Quellenangabe — Regelbuchseite oder Wikilink, klein am Fuß."
      en: "Source reference — rulebook page or wikilink, small at the foot."
    sample:
      de: "Regelbuch S. 130"
      en: "Rulebook p. 130"

  # Bound where a face shows it: the front of a gear kit, the back of a
  # character.
  image:
    aliases: [bild]
    description:
      de: "Bild der Karte — ein Wikilink auf ein Bild im Vault."
      en: "The card's picture — a wikilink to a picture in the vault."

translations:
  de:
    back-label: "Troubleshooters"
    back-logo-the: "THE"
    back-logo-name: "TROUBLESHOOTERS"
    back-logo-name-1: "TROUBLE-"
    back-logo-name-2: "SHOOTERS"
  en:
    back-label: "Troubleshooters"
    back-logo-the: "THE"
    back-logo-name: "TROUBLESHOOTERS"
    back-logo-name-1: "TROUBLE-"
    back-logo-name-2: "SHOOTERS"

card-types:
  # ── gear ────────────────────────────────────────────────────────────
  # A gear kit, borderless on white: the name in red small capitals, the
  # picture, what the kit holds, its traits with their names in blue, the
  # story points; the reference at the foot's right. The back is the logo
  # in red, rotated, with the kind at the top right.
  gear:
    front-template: templates/gear-front.hbs
    back-template: templates/gear-back.hbs
    stylesheet: styles/gear.css

    translations:
      de:
        back-label: "Ausrüstung"
        front-story-points-label: "Story-Punkte"
      en:
        back-label: "Gear"
        front-story-points-label: "Story points"

    properties:
      name:
        sample:
          de: "Feldstecher"
          en: "Field glasses"

      image:
        slot: front-image
        sample: "[[Feldstecher.png]]"

      content:
        slot: front-text
        aliases: [inhalt]
        description:
          de: "Was das Kit enthält — ein Satz oder eine Aufzählung mit Kommas."
          en: "What the kit holds — a sentence or a comma-separated list."
        sample:
          de: "Fernglas 8×30 im Lederetui, Trageriemen, Putztuch"
          en: "8×30 binoculars in a leather case, strap, cleaning cloth"

      traits:
        slot: front-traits
        aliases: [eigenschaften]
        description:
          de: "Die Eigenschaften des Kits — eine Liste von `name` und `desc`, der Name blau und fett, die Beschreibung dahinter."
          en: "The kit's traits — a list of `name` and `desc`, the name blue and bold, the description after it."
        sample:
          de:
            - name: "Beobachten"
              desc: "+2 Pips auf weite Entfernung"
          en:
            - name: "Observation"
              desc: "+2 pips at long range"

      story-points:
        slot: front-story-points
        aliases: [story-punkte, "story punkte"]
        description:
          de: "Was das Kit in Story-Punkten kostet — meist 1 oder 2."
          en: "What the kit costs in story points — usually 1 or 2."
        sample: 1

  # ── mechanic ────────────────────────────────────────────────────────
  # A rule in an orange frame: what it requires after a blue caption, the
  # prose, the points as an orange-bulleted list; the reference at the
  # foot's left. The back is the logo in its white box on an orange field.
  mechanic:
    front-template: templates/mechanic-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/mechanic.css

    translations:
      de:
        back-label: "Mechanik"
        front-requires-label: "Erfordert"
      en:
        back-label: "Mechanic"
        front-requires-label: "Requires"

    properties:
      name:
        sample:
          de: "Deckung suchen"
          en: "Taking cover"

      requires:
        slot: front-requires
        aliases: [erfordert]
        description:
          de: "Voraussetzung oder Auslöser der Mechanik — eine Aktionsart, eine Mindestinitiative, eine gelungene Probe."
          en: "What the mechanic requires or what triggers it — an action type, a minimum initiative, a successful check."
        sample:
          de: "Bewegungsaktion"
          en: "Move action"

      content:
        slot: front-text
        aliases: [inhalt, beschreibung, description]
        description:
          de: "Der Regeltext — Markdown, gern mehrere Absätze."
          en: "The rule's text — markdown, paragraphs welcome."
        sample:
          de: "Wer sich hinter etwas Festes duckt, ist für Fernkampfangriffe schwerer zu treffen, solange die Deckung hält."
          en: "Whoever ducks behind something solid is harder to hit at range for as long as the cover holds."

      points:
        slot: front-points
        aliases: [punkte]
        description:
          de: "Die Aufzählungspunkte der Mechanik — eine Liste von `name` und `desc`, orange Punkte davor."
          en: "The mechanic's bullet points — a list of `name` and `desc`, orange bullets before them."
        sample:
          de:
            - name: "Leichte Deckung:"
              desc: "Angriffe auf dich sind um −1 Pip erschwert."
            - name: "Schwere Deckung:"
              desc: "Angriffe auf dich sind um −2 Pips erschwert; ein Patzer trifft die Deckung."
          en:
            - name: "Light cover:"
              desc: "Attacks against you are at −1 pip."
            - name: "Heavy cover:"
              desc: "Attacks against you are at −2 pips; a fumble hits the cover instead."

  # ── npc ─────────────────────────────────────────────────────────────
  # A director character in the game's blue: the kind on the strip beside
  # the name, initiative, vitality and defence on one line, the traits,
  # the attacks and the skills as lists, the languages, the description;
  # the reference at the foot's right. The back is the picture where the
  # note has one, else the logo box with the name under it.
  npc:
    front-template: templates/npc-front.hbs
    back-template: templates/npc-back.hbs
    stylesheet: styles/npc.css

    translations:
      de:
        card-type-label: "NSC"
        back-label: "NSC"
        front-initiative-label: "Initiative"
        front-vitality-label: "Vitalität"
        front-defense-label: "Verteidigung"
        front-traits-label: "Eigenschaften"
        front-attacks-label: "Angriffe"
        front-skills-label: "Kompetenzen"
        front-languages-label: "Sprachen"
      en:
        card-type-label: "NPC"
        back-label: "NPC"
        front-initiative-label: "Initiative"
        front-vitality-label: "Vitality"
        front-defense-label: "Defence"
        front-traits-label: "Traits"
        front-attacks-label: "Attacks"
        front-skills-label: "Skills"
        front-languages-label: "Languages"

    properties:
      name:
        slot: [front-title, back-title]
        sample:
          de: "Zollbeamtin"
          en: "Customs officer"

      image:
        slot: back-image
        sample: "[[Zollbeamtin.png]]"

      initiative:
        slot: front-initiative
        description:
          de: "Initiative im Kampf — Untergebene und Leutnants meist 7, Handlanger 5."
          en: "Initiative in combat — underlings and lieutenants usually 7, mooks 5."
        sample: 5

      vitality:
        slot: front-vitality
        aliases: [vitalität, vitalitaet]
        description:
          de: "Vitalitätspunkte — Untergebene um 5, Bosse 7 und mehr."
          en: "Vitality points — underlings around 5, bosses 7 and up."
        sample: 4

      defense:
        slot: front-defense
        aliases: [verteidigung, defence]
        description:
          de: "Verteidigung in Prozent — nur Leutnants und Bosse haben eine."
          en: "Defence in percent — only lieutenants and bosses have one."

      traits:
        slot: front-traits
        aliases: [eigenschaften]
        description:
          de: "Die Eigenschaften des Charakters in einer Zeile — „Untergebener“, „Handlanger“, gern als Wikilinks."
          en: "The character's traits on one line — \"Underling\", \"Mook\", wikilinks welcome."
        sample:
          de: "[[Untergebener]]"
          en: "[[Underling]]"

      attacks:
        slot: front-attacks
        aliases: [angriffe]
        description:
          de: "Die Angriffe — eine Liste von `name` und `desc`: die Waffe, dann Kompetenz in Prozent, Schaden und Eigenschaften."
          en: "The attacks — a list of `name` and `desc`: the weapon, then the skill in percent, the damage and the traits."
        sample:
          de:
            - name: "Dienstpistole:"
              desc: "45 %, 5 WX, Laut, Kurze Reichweite"
          en:
            - name: "Service pistol:"
              desc: "45%, 5dX, Loud, Short range"

      skills:
        slot: front-skills
        aliases: [kompetenzen]
        description:
          de: "Die Kompetenzen — eine Liste von `name` und `desc` mit dem Prozentwert; üblich zuerst Basis und Spezial."
          en: "The skills — a list of `name` and `desc` with the percentage; basic and special usually first."
        sample:
          de:
            - name: "Basis:"
              desc: "35 %"
            - name: "Spezial:"
              desc: "55 %"
            - name: "Gepäck durchsuchen:"
              desc: "65 %"
          en:
            - name: "Basic:"
              desc: "35%"
            - name: "Special:"
              desc: "55%"
            - name: "Searching luggage:"
              desc: "65%"

      languages:
        slot: front-languages
        aliases: [sprachen]
        description:
          de: "Gesprochene Sprachen, den Grad in Klammern."
          en: "Spoken languages, the fluency in parentheses."
        sample:
          de: "Deutsch (Muttersprache), Französisch (fließend)"
          en: "German (native), French (fluent)"

      description:
        slot: front-text
        aliases: [beschreibung]
        description:
          de: "Wer der Charakter ist und was er tut — ein kurzer Absatz unter den Werten."
          en: "Who the character is and what they do — a short paragraph under the numbers."
        sample:
          de: "Prüft an der Grenze Pässe und Koffer, kennt jeden Trick der Schmuggler und lässt sich von keinem Lächeln beeindrucken."
          en: "Checks passports and suitcases at the border, knows every smuggler's trick and is impressed by no smile."
