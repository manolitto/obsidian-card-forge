id: dino-island
name: "Flucht von Dino Island"

# Modelled on the German edition of "Flucht von Dino Island" (Sam Tung &
# Sam Roberts): a white card face with the book's accents — a yellow
# banner, an orange die badge, a thin orange rule under a heading in
# distressed poster capitals — and a gold-and-red wordmark on the back.
# Nunito Sans for the text, Rubik Distressed for the display. The book is
# German only, and so is this system. The sample values are invented.
#
# Three card types: an entry of one of the book's roll tables, a location
# on the island with its moves on the back, and a family of the island's
# animals with the book's illustration on the back.
languages: [de]

stylesheet: styles/dino-island.css

partial-templates:
  footer: templates/footer.hbs
  wordmark: templates/wordmark.hbs

# Entries are a few sentences and rarely spill; when one does it fills the
# back — a wordmark, not a designed face — before it spawns a card.
overflow-mode: back-then-cards

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, titel, anzeigename]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  description:
    slot: front-text
    aliases: [beschreibung, text, gerücht, geruecht, flavour, flavor, flavortext]
    description:
      de: "Der Kartentext — bei einem Tabelleneintrag der Eintrag selbst (Markdown)."
      en: "The card's text — for a table entry, the entry itself (markdown)."
    sample:
      de: "Kompasse funktionieren auf der Insel nicht so, wie sie sollten."
      en: "Compasses do not work on the island the way they should."

  reference:
    slot: front-footer
    aliases: [referenz, quelle, buch, seite]
    description:
      de: "Quellenangabe — Regelwerkseite oder Wikilink, klein am Fuß."
      en: "Source reference — rulebook page or wikilink, small at the foot."
    sample:
      de: "Regelwerk S. 29"
      en: "Rulebook p. 29"

translations:
  de:
    back-wordmark-line-1: "Flucht von"
    back-wordmark-line-2: "Dino Island"
    back-label: "Karte"

card-types:
  # ── roll-table ──────────────────────────────────────────────────────
  # One entry of any of the book's roll tables: the roll as an orange die
  # in the top-left corner, the table's title in the yellow banner, the
  # entry as the body. A table note prints a card per row, and its
  # frontmatter carries the title and the source for all of them.
  roll-table:
    front-template: templates/roll-table-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/roll-table.css
    expand-by-roll: true

    translations:
      de:
        card-type-label: "Tabelle"
        back-label: "Tabelle"

    properties:
      heading:
        slot: [front-heading, back-heading]
        aliases: [tabelle, überschrift, ueberschrift, tabellentitel]
        description:
          de: "Titel der Tabelle — im Banner der Vorderseite und als Beschriftung der Rückseite („Gerücht“, „Wo seid ihr?“). In einer Tabellennotiz einmal im Frontmatter für alle Zeilen."
          en: "The table's title — in the front's banner and as the back's caption (\"Rumour\", \"Where are you?\"). In a table note, once in the frontmatter for every row."
        sample:
          de: "Gerücht"
          en: "Rumour"

      # An entry has no name of its own; the table's title is the heading.
      name:
        slot: ~

      roll:
        slot: front-roll
        description:
          de: "Der Wurf des Eintrags — die orange Würfelmarke oben links."
          en: "The entry's roll — the orange die at the top left."
        sample: "7"

      description:
        description:
          de: "Der Text des Eintrags — der Kartentext (Markdown)."
          en: "The entry's text — the card's text (markdown)."

  # ── location ────────────────────────────────────────────────────────
  # A place on the island: the category as an eyebrow over the name, the
  # atmosphere line, what is to be found there as a list; the back carries
  # the same heading and the location's moves.
  location:
    front-template: templates/location-front.hbs
    back-template: templates/location-back.hbs
    stylesheet: styles/location.css

    translations:
      de:
        back-label: "Ort"
        front-contents-label: "Was hier zu finden ist:"
        back-moves-label: "Ortsspielzüge:"

    properties:
      name:
        slot: [front-title, back-title]
        aliases: [ort]
        sample:
          de: "Die Salzklippen"
          en: "The Salt Cliffs"

      # A location has an atmosphere line and a list, no running text.
      description:
        slot: ~

      category:
        slot: [front-category, back-category]
        aliases: [kategorie, gruppe, ortstyp]
        description:
          de: "Kategorie des Ortes — „Natürliche Orte“, „Erbaute Orte“, „Im Komplex“, „Seltsame Orte“ — als kleine Zeile über dem Namen."
          en: "The location's category — a small line above the name."
        sample:
          de: "Natürliche Orte"
          en: "Natural places"

      atmosphere:
        slot: front-atmosphere
        aliases: [stimmung, atmosphäre, atmosphaere, sinneseindruck]
        description:
          de: "Ein Satz für die Stimmung des Ortes, kursiv (Markdown)."
          en: "A sentence for the place's atmosphere, in italics (markdown)."
        sample:
          de: "Salzgeruch, Möwengeschrei und ein Wind, der die Worte verschluckt."
          en: "The smell of salt, gulls' cries and a wind that swallows words."

      contents:
        slot: front-contents
        aliases: [funde, inhalt, was-hier-zu-finden-ist, zu-finden]
        description:
          de: "„Was hier zu finden ist“ — eine Liste, als Aufzählung gedruckt (Markdown)."
          en: "\"What is here\" — a list, printed as bullets (markdown)."
        sample:
          de:
            - "Ein verlassener Beobachtungsposten"
            - "Nistplätze in der Klippe"
            - "ein Boot, das nicht mehr schwimmt"
          en:
            - "An abandoned lookout"
            - "nests in the cliff"
            - "a boat that no longer floats"

      moves:
        slot: back-moves
        aliases: [spielzüge, spielzuege, ortsspielzüge, ortsspielzuege, züge, zuege]
        description:
          de: "„Ortsspielzüge“ — die Spielzüge, die dieser Ort der Spielleitung gibt; eine Liste, auf der Rückseite."
          en: "\"Location moves\" — the moves this place gives the game master; a list, on the back."
        sample:
          de:
            - "Lass den Boden unter jemandem bröckeln."
            - "Ein Schwarm geht in die Luft und verrät die Gruppe."
          en:
            - "Let the ground crumble under someone."
            - "A flock takes to the air and gives the group away."

      reference:
        sample:
          de: "Regelwerk S. 38"
          en: "Rulebook p. 38"

  # ── taxonomy ────────────────────────────────────────────────────────
  # A family of the island's animals: the name under the orange rule, the
  # description, then the four captioned fields — occurrence, instinct,
  # the moves as a die-bulleted list, the genera; the illustration on the
  # back.
  taxonomy:
    front-template: templates/taxonomy-front.hbs
    back-template: templates/taxonomy-back.hbs
    stylesheet: styles/taxonomy.css

    translations:
      de:
        back-label: "Taxonomie"
        front-occurrence-label: "Auftreten (Anzahl):"
        front-instinct-label: "Instinkt:"
        front-moves-label: "Spielzüge:"
        front-genera-label: "Gattungen:"

    properties:
      name:
        sample:
          de: "Panzerläufer"
          en: "Armoured walkers"

      description:
        description:
          de: "Einleitender Satz zur Tierfamilie, kursiv (Markdown)."
          en: "An introductory sentence on the family, in italics (markdown)."
        sample:
          de: "Gepanzerte Pflanzenfresser, die sich lieber eingraben als weglaufen."
          en: "Armoured herbivores that would rather dig in than run."

      occurrence:
        slot: front-occurrence
        aliases: [auftreten, anzahl, vorkommen]
        description:
          de: "„Auftreten (Anzahl)“ — wie und in welcher Zahl die Tiere auftreten."
          en: "\"Occurrence (number)\" — how and in what numbers the animals appear."
        sample:
          de: "Paarweise, die Jungen dazwischen"
          en: "In pairs, the young between them"

      instinct:
        slot: front-instinct
        aliases: [instinkt, trieb]
        description:
          de: "„Instinkt“ — das Grundverhalten der Familie."
          en: "\"Instinct\" — the family's basic behaviour."
        sample:
          de: "Sich eingraben und abwarten"
          en: "Dig in and wait"

      moves:
        slot: front-moves
        aliases: [spielzüge, spielzuege, spielzug, züge, zuege]
        description:
          de: "„Spielzüge“ — die Spielzüge, die diese Familie der Spielleitung gibt; eine Liste."
          en: "\"Moves\" — the moves this family gives the game master; a list."
        sample:
          de:
            - "Schwanzhieb"
            - "Steck den Kopf in den Sand"
            - "Lass dich nicht vom Fleck bewegen"
          en:
            - "Tail swipe"
            - "Bury the head in the sand"
            - "Refuse to be moved"

      genera:
        slot: front-genera
        aliases: [gattungen, beispiele, arten, gattung]
        description:
          de: "„Gattungen“ — Beispielgattungen der Familie."
          en: "\"Genera\" — example genera of the family."
        sample:
          de: "Saichania, Pinacosaurus"
          en: "Saichania, Pinacosaurus"

      image:
        slot: back-image
        aliases: [bild, abbildung, illustration]
        description:
          de: "Die Illustration der Familie auf der Rückseite — ein Wikilink auf ein Bild im Vault."
          en: "The family's illustration on the back — a wikilink to a picture in the vault."
        sample: "[[Panzerlaeufer.png]]"

      reference:
        sample:
          de: "Regelwerk S. 46"
          en: "Rulebook p. 46"
