id: sw
name: "Swords & Wizardry"

# Modelled on the German rulebook's interior: cream paper, warm near-black
# text, deep ink-blue for every title, ornament and rule, the section
# heads flanked by a pair of mirrored scrollwork flourishes, a single
# curl climbing over the page number at the foot. EB Garamond for the
# text, Cinzel for the display capitals. Bilingual, German first; the
# notes are German and the captions come in both.
#
# Two card types: a magic item from the treasure chapter and a monster
# with its stat block, the seven lines of the rulebook's entry followed
# by the abilities spelled out. The sample values are invented. The
# terminology follows the game; OGL.txt beside this document says what
# that means.
languages: [de, en]

stylesheet: styles/sw.css

partial-templates:
  header: templates/header.hbs
  banner: templates/banner.hbs
  footer: templates/footer.hbs

# A monster with many abilities fills the front, then the back — the
# back is a wordmark, not a designed face — then a further card.
overflow-mode: back-then-cards

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, anzeigename, display-name]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  description:
    slot: front-text
    aliases: [beschreibung, flavour, flavor, flavortext]
    description:
      de: "Stimmungstext oder Kurzbeschreibung — eine einleitende Zeile in Kursiv."
      en: "Flavour or a short description — an italic introductory line."

  image:
    slot: front-image
    aliases: [bild, picture, portrait]
    description:
      de: "Bild der Karte — ein Wikilink auf ein Bild im Vault, als Tafel unter dem Stimmungstext."
      en: "The card's picture — a wikilink to a picture in the vault, a plate under the flavour."
    sample: "[[Mondsichelklinge.png]]"

  reference:
    slot: front-footer
    aliases: [referenz, quelle, buch]
    description:
      de: "Quellenangabe — Regelwerkseite oder Wikilink, kursiv neben der Schlussranke."
      en: "Source reference — rulebook page or wikilink, in italics beside the foot's curl."
    sample:
      de: "Gesamtregelwerk S. 200"
      en: "Complete Rules p. 200"

translations:
  de:
    back-label: "Karte"
    back-wordmark-line-1: "SWORDS"
    back-wordmark-ampersand: "&"
    back-wordmark-line-2: "WIZARDRY"
    back-tagline: "GESAMTREGELWERK"
  en:
    back-label: "Card"
    back-wordmark-line-1: "SWORDS"
    back-wordmark-ampersand: "&"
    back-wordmark-line-2: "WIZARDRY"
    back-tagline: "COMPLETE RULES"

card-types:
  item:    card-types/item.yaml
  monster: card-types/monster.yaml
