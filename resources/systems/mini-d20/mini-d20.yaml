id: mini-d20
name: "MINI D20"

# Modelled on the MINI D20 rulebook (Seba, kritischerfehlschlag.de): white
# paper, black ink, a brick-red hairline under table heads and along the
# card's foot, the stacked red "MiNI / D20" wordmark on the back, Merriweather
# for the text and a wedge-serif display face for the titles. No ornament
# beyond that — the book has none. Bilingual: every caption in German and
# English, and the sample values in both.
#
# Eight card types. Six of them share one header — a small icon in each top
# corner, the name between them, the card type's label under the left icon
# and a sub-type under the right — and one back, the wordmark between the
# same two icons. The left icon is the card type's own, a property with a
# default; the right one is DERIVED from what the card is about (the
# archetype, the creature's category, the equipment's kind, the people's
# name) through a classifier whose tokens are the icons' paths. The cover
# and the generic card have faces of their own.
#
# The icons are game-icons.net's, CC BY 3.0 — assets/icons/NOTICE.md names
# every file and its artist. Number and noun that belong together are
# joined with a non-breaking space in the sample values ("5 GM", "Stufe 4",
# "+ 4 TP"): the cards are dense, and a break inside such a pair is what the
# eye trips over.
languages: [de, en]

stylesheet: styles/mini-d20.css

partial-templates:
  header: templates/header.hbs
  footer: templates/footer.hbs
  tags: templates/tags.hbs
  flavour: templates/flavour.hbs
  wordmark: templates/wordmark.hbs

# The stat blocks are lean and most cards fit their front; a long one fills
# the back — a wordmark, not a designed face that would be missed — before
# it spawns a card. The cover and the generic card say otherwise below.
overflow-mode: back-then-cards

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, anzeigename]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  description:
    slot: front-text
    aliases: [beschreibung, flavour, flavor, flavortext]
    description:
      de: "Stimmungstext oder Kurzbeschreibung — eine kursive Zeile am Fuß der Karte."
      en: "Flavour or a short description — an italic line at the foot of the card."
    sample:
      de: "Eine schlanke, einhändige Klinge aus geschmiedetem Stahl."
      en: "A slender, one-handed blade of forged steel."

  image:
    slot: front-image
    aliases: [bild]
    description:
      de: "Bild der Karte als Wikilink (`[[Bild.png]]`), Embed (`![[Bild.png]]`) oder Dateiname. Steht zwischen den Werten und dem Stimmungstext und nimmt den Platz, der bleibt."
      en: "The card's picture as a wikilink (`[[image.png]]`), embed (`![[image.png]]`) or file name. Sits between the stats and the flavour and takes the room that is left."
    sample: "[[Gegenstand.png]]"

  reference:
    slot: front-footer
    aliases: [referenz, quelle, buch]
    description:
      de: "Quellenangabe — Regelwerkseite oder Wikilink, klein unter der roten Linie am Fuß."
      en: "Source reference — rulebook page or wikilink, small under the red line at the foot."
    sample:
      de: "Regelwerk S. 16"
      en: "Rules p. 16"

# The strings the shared faces read that are not a place's caption.
translations:
  de:
    back-wordmark-line-1: "MiNI"
    back-wordmark-line-2: "D20"
    back-tagline: "Ein Rollenspiel von Seba"
  en:
    back-wordmark-line-1: "MiNI"
    back-wordmark-line-2: "D20"
    back-tagline: "A Roleplaying Game by Seba"

card-types:
  ability:   card-types/ability.yaml
  archetype: card-types/archetype.yaml
  bestiary:  card-types/bestiary.yaml
  equipment: card-types/equipment.yaml
  heritage:  card-types/heritage.yaml
  quirk:     card-types/quirk.yaml
  cover:     card-types/cover.yaml
  generic:   card-types/generic.yaml
