id: dcc
name: "Dungeon Crawl Classics"

# Modelled on the rulebook's interior: cream paper, black ink, heavy Roman
# capitals for the headings, a double-line frame around the body, the
# crimson stacked wordmark on the back. Cinzel for the display, TeX Gyre
# Pagella (a Palatino) for the text. Bilingual, German first; the notes are
# German and the captions come in both.
#
# Two card types: the occupation of a 0-level character, one card per row
# of the rulebook's occupation table with the roll it is listed under, and
# a piece of equipment from the equipment chapter's tables. The sample
# values are invented. The terminology follows the game; OGL.txt beside
# this document says what that means.
languages: [de, en]

stylesheet: styles/dcc.css

partial-templates:
  header: templates/header.hbs
  footer: templates/footer.hbs
  wordmark: templates/wordmark.hbs

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, beruf, occupation]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  roll:
    slot: front-roll
    description:
      de: "Der Wurf, unter dem der Eintrag in seiner Tabelle steht — als Abzeichen neben dem Titel. `roll-min` und `roll-max` daneben sind die Zahlen dazu."
      en: "The roll the entry is listed under in its table — a badge beside the title. `roll-min` and `roll-max` beside it are the numbers."
    sample: "07"

  description:
    slot: front-text
    aliases: [beschreibung]
    description:
      de: "Stimmungstext oder Kurzbeschreibung, kursiv."
      en: "Flavour or a short description, in italics."

  reference:
    slot: front-footer-right
    aliases: [referenz, buch, quelle]
    description:
      de: "Quellenangabe — Regelwerkseite oder Wikilink, klein rechts am Fuß."
      en: "Source reference — rulebook page or wikilink, small at the foot's right."
    sample:
      de: "Regelwerk S. 26"
      en: "Core Rulebook p. 22"

  original-name:
    slot: front-footer-left
    aliases: [english, englisch, english-name, originalname]
    description:
      de: "Englischer Originalname, klein links am Fuß mit dem Präfix „engl.“; auf englischen Karten ausgeblendet."
      en: "English original name, small at the foot's left, prefixed \"engl.\"; hidden on English cards."
    sample: "Stargazer"

translations:
  de:
    back-label: "Karte"
    back-tagline: "Reichtum und Ruhm durch Schwert und Magie"
    back-wordmark-line-1: "DUNGEON"
    back-wordmark-line-2: "CRAWL"
    back-wordmark-line-3: "CLASSICS"
    front-footer-left-label: "engl."
  en:
    back-label: "Card"
    back-tagline: "Glory & Gold won by Sorcery & Sword"
    back-wordmark-line-1: "DUNGEON"
    back-wordmark-line-2: "CRAWL"
    back-wordmark-line-3: "CLASSICS"
    front-footer-left-label: "orig."

card-types:
  # ── occupation ──────────────────────────────────────────────────────
  # One card per row of the 0-level occupation table: the roll, the
  # occupation, its people where it has one, the trained weapon and the
  # trade goods, each under a small-caps caption.
  occupation:
    front-template: templates/occupation-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/occupation.css

    translations:
      de:
        back-label: "Beruf"
        front-race-label: "Volk"
        front-weapon-label: "Geübte Waffe"
        front-goods-label: "Handelsware"
      en:
        back-label: "Occupation"
        front-race-label: "Race"
        front-weapon-label: "Trained weapon"
        front-goods-label: "Trade goods"

    properties:
      name:
        sample:
          de: "Sterndeuter"
          en: "Stargazer"

      race:
        slot: front-race
        aliases: [volk]
        description:
          de: "Volk eines halbmenschlichen Berufs — Halbling, Zwerg, Elf. Nur wo eines gilt."
          en: "The people of a demi-human occupation — Halfling, Dwarf, Elf. Only where one applies."

      trained-weapon:
        slot: front-weapon
        aliases: [geübte-waffe, geuebte-waffe, waffe, weapon]
        description:
          de: "Die im Beruf geübte Waffe, mit ihrem Würfel — „Stab (1W4)“."
          en: "The weapon the occupation is trained in, with its die — \"Staff (1d4)\"."
        sample:
          de: "Stab (1W4)"
          en: "Staff (1d4)"

      trade-goods:
        slot: front-goods
        aliases: [handelsware, ware, goods]
        description:
          de: "Die Handelsware, die der Beruf zu Beginn mitbringt."
          en: "The trade goods the occupation starts with."
        sample:
          de: "Sternkarte"
          en: "Star chart"

  # ── equipment ───────────────────────────────────────────────────────
  # A weapon, a piece of armour, ammunition, gear or a mount from the
  # equipment chapter: the kind under the title, the stats that apply as
  # labelled rows, the rulebook's footnotes as an italic list.
  equipment:
    front-template: templates/equipment-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/equipment.css

    translations:
      de:
        back-label: "Ausrüstung"
        front-damage-label: "Schaden"
        front-range-label: "Reichweite"
        front-ac-bonus-label: "RK-Bonus"
        front-check-penalty-label: "Malus"
        front-speed-penalty-label: "Bewegungsrate"
        front-fumble-die-label: "Patzerwürfel"
        front-quantity-label: "Menge"
        front-weight-label: "Gewicht"
        front-cost-label: "Preis"
      en:
        back-label: "Equipment"
        front-damage-label: "Damage"
        front-range-label: "Range"
        front-ac-bonus-label: "AC bonus"
        front-check-penalty-label: "Check penalty"
        front-speed-penalty-label: "Speed"
        front-fumble-die-label: "Fumble die"
        front-quantity-label: "Quantity"
        front-weight-label: "Weight"
        front-cost-label: "Cost"

    properties:
      name:
        sample:
          de: "Wurfhaken"
          en: "Grappling hook"

      type:
        slot: front-subtype
        aliases: [unterart, kategorie, subtype, category]
        description:
          de: "Art des Gegenstands, so wie sie unter dem Titel stehen soll — „Waffe“, „Rüstung“, „Munition“, „Ausrüstung“, „Reittier“."
          en: "The kind of equipment, as it is to stand under the title — \"Weapon\", \"Armor\", \"Ammunition\", \"Gear\", \"Mount\"."
        sample:
          de: "Ausrüstung"
          en: "Gear"

      cost:
        slot: front-cost
        aliases: [preis, kosten, price]
        description:
          de: "Preis in der Währung des Regelwerks — Goldmünzen (GM), Silbermünzen (SM), Kupfermünzen (KM)."
          en: "Price in the rulebook's coin — gold pieces (gp), silver pieces (sp), copper pieces (cp)."
        sample:
          de: "1 GM"
          en: "1 gp"

      damage:
        slot: front-damage
        aliases: [schaden, dmg]
        description:
          de: "Schadenswürfel einer Waffe, z. B. „1W8“."
          en: "A weapon's damage die, e.g. \"1d8\"."

      range:
        slot: front-range
        aliases: [reichweite, distance]
        description:
          de: "Reichweite einer Fernkampfwaffe — nah/mittel/weit, z. B. „21/42/63“."
          en: "A ranged weapon's range — short/medium/long, e.g. \"70/140/210\"."

      ac-bonus:
        slot: front-ac-bonus
        aliases: [rk-bonus, armor-bonus]
        description:
          de: "Bonus einer Rüstung auf die Rüstungsklasse; das Vorzeichen wird ergänzt (`5` druckt „+5“)."
          en: "An armour's bonus to Armor Class; the sign is added (`5` prints \"+5\")."

      check-penalty:
        slot: front-check-penalty
        aliases: [probenabzug, malus]
        description:
          de: "Malus einer Rüstung auf Proben; das Vorzeichen wird ergänzt."
          en: "An armour's penalty on checks; the sign is added."

      speed-penalty:
        slot: front-speed-penalty
        aliases: [bewegungsabzug, movement-penalty]
        description:
          de: "Malus einer Rüstung auf die Bewegungsrate, z. B. „-1,5 m“."
          en: "An armour's penalty to speed, e.g. \"-5'\"."

      fumble-die:
        slot: front-fumble-die
        aliases: [patzerwürfel, patzerwuerfel, fumble]
        description:
          de: "Der Patzerwürfel in dieser Rüstung, z. B. „W12“."
          en: "The fumble die while wearing this armour, e.g. \"d12\"."

      quantity:
        slot: front-quantity
        aliases: [anzahl, menge, count, amount]
        description:
          de: "Stückzahl je Einheit — Pfeile im Köcher."
          en: "Items per unit — arrows to a quiver."

      weight:
        slot: front-weight
        aliases: [gewicht]
        description:
          de: "Gewicht, wo die Tabelle eines nennt."
          en: "Weight, where the table gives one."

      notes:
        slot: front-notes
        aliases: [anmerkungen, anmerkung, fußnoten, fussnoten, note, footnotes]
        description:
          de: "Die Fußnoten des Regelwerks, die für diesen Gegenstand gelten — eine Liste, jeder Eintrag ein kursiver Satz am Fuß."
          en: "The rulebook's footnotes that apply to this item — a list, each entry an italic line at the foot."
        sample:
          de:
            - "Hält an Holz und Stein; an glattem Fels bei einer 1 nicht."
          en:
            - "Holds on wood and stone; on smooth rock, not on a 1."
