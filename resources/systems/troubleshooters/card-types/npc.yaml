# ── npc ─────────────────────────────────────────────────────────────
# A director character in the game's blue: the kind on the strip beside
# the name, initiative, vitality and defence on one line, the traits,
# the attacks and the skills as lists, the languages, the description;
# the reference at the foot's right. The back is the picture where the
# note has one, else the logo box with the name under it.

front-template: templates/npc-front.hbs
back-template: templates/npc-back.hbs
stylesheet: styles/npc.css

translations:
  de:
    card-type-label: "NSC"
    back-label: "NSC"
    front-initiative-label: "Initiative"
    front-vitality-label: "Vitalität"
    front-defense-label: "Verteidigung"
    front-traits-label: "Eigenschaften"
    front-attacks-label: "Angriffe"
    front-skills-label: "Kompetenzen"
    front-languages-label: "Sprachen"
  en:
    card-type-label: "NPC"
    back-label: "NPC"
    front-initiative-label: "Initiative"
    front-vitality-label: "Vitality"
    front-defense-label: "Defence"
    front-traits-label: "Traits"
    front-attacks-label: "Attacks"
    front-skills-label: "Skills"
    front-languages-label: "Languages"

properties:
  name:
    slot: [front-title, back-title]
    sample:
      de: "Zollbeamtin"
      en: "Customs officer"

  image:
    slot: back-image
    sample: "[[Zollbeamtin.png]]"

  initiative:
    slot: front-initiative
    description:
      de: "Initiative im Kampf — Untergebene und Leutnants meist 7, Handlanger 5."
      en: "Initiative in combat — underlings and lieutenants usually 7, mooks 5."
    sample: 5

  vitality:
    slot: front-vitality
    aliases: [vitalität, vitalitaet]
    description:
      de: "Vitalitätspunkte — Untergebene um 5, Bosse 7 und mehr."
      en: "Vitality points — underlings around 5, bosses 7 and up."
    sample: 4

  defense:
    slot: front-defense
    aliases: [verteidigung, defence]
    description:
      de: "Verteidigung in Prozent — nur Leutnants und Bosse haben eine."
      en: "Defence in percent — only lieutenants and bosses have one."

  traits:
    slot: front-traits
    aliases: [eigenschaften]
    description:
      de: "Die Eigenschaften des Charakters in einer Zeile — „Untergebener“, „Handlanger“, gern als Wikilinks."
      en: "The character's traits on one line — \"Underling\", \"Mook\", wikilinks welcome."
    sample:
      de: "[[Untergebener]]"
      en: "[[Underling]]"

  attacks:
    slot: front-attacks
    aliases: [angriffe]
    description:
      de: "Die Angriffe — eine Liste von `name` und `desc`: die Waffe, dann Kompetenz in Prozent, Schaden und Eigenschaften."
      en: "The attacks — a list of `name` and `desc`: the weapon, then the skill in percent, the damage and the traits."
    sample:
      de:
        - name: "Dienstpistole:"
          desc: "45 %, 5 WX, Laut, Kurze Reichweite"
      en:
        - name: "Service pistol:"
          desc: "45%, 5dX, Loud, Short range"

  skills:
    slot: front-skills
    aliases: [kompetenzen]
    description:
      de: "Die Kompetenzen — eine Liste von `name` und `desc` mit dem Prozentwert; üblich zuerst Basis und Spezial."
      en: "The skills — a list of `name` and `desc` with the percentage; basic and special usually first."
    sample:
      de:
        - name: "Basis:"
          desc: "35 %"
        - name: "Spezial:"
          desc: "55 %"
        - name: "Gepäck durchsuchen:"
          desc: "65 %"
      en:
        - name: "Basic:"
          desc: "35%"
        - name: "Special:"
          desc: "55%"
        - name: "Searching luggage:"
          desc: "65%"

  languages:
    slot: front-languages
    aliases: [sprachen]
    description:
      de: "Gesprochene Sprachen, den Grad in Klammern."
      en: "Spoken languages, the fluency in parentheses."
    sample:
      de: "Deutsch (Muttersprache), Französisch (fließend)"
      en: "German (native), French (fluent)"

  description:
    slot: front-text
    aliases: [beschreibung]
    description:
      de: "Wer der Charakter ist und was er tut — ein kurzer Absatz unter den Werten."
      en: "Who the character is and what they do — a short paragraph under the numbers."
    sample:
      de: "Prüft an der Grenze Pässe und Koffer, kennt jeden Trick der Schmuggler und lässt sich von keinem Lächeln beeindrucken."
      en: "Checks passports and suitcases at the border, knows every smuggler's trick and is impressed by no smile."
