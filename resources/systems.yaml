# The bundled systems, in the order they are listed to the user.
#
# Each entry is the path of a system's root document, relative to
# `resources/systems/`; the folder holding it is the system. The system's id
# is in that document; nothing here repeats it. A folder under
# `resources/systems/` that this list does not name is a build error, not a
# system.
systems:
  - simple/simple.yaml
  - dragonbane/dragonbane.yaml
  - eiserne-zeit/eiserne-zeit.yaml
  - pf2e/pf2e.yaml
  - mini-d20/mini-d20.yaml
  - dcc/dcc.yaml
  - dino-island/dino-island.yaml
  - tor2e/tor2e.yaml
