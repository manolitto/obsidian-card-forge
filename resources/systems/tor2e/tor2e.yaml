id: tor2e
name: "The One Ring 2E"

# Modelled on the second edition's rulebook: dark red-brown frames, a
# parchment field, deep red rules and diamonds holding the key numbers,
# EB Garamond small caps for the titles and Source Sans for the text.
# Bilingual, German first — the German edition's terminology in the
# aliases and the captions. The sample values are invented.
#
# Two card types: a piece of gear — a weapon, an armour or a shield, told
# apart by which stats it carries — and an adversary on the large card,
# with the rulebook's stat block and its picture on the back.
#
# The notes are written in the frontmatter, as a vault's reference notes
# are: the block names the system, and the tags name the card type.
languages: [de, en]

stylesheet: styles/tor2e.css

partial-templates:
  diamond: templates/diamond.hbs

# ── Shared vocabulary ─────────────────────────────────────────────────
properties:
  name:
    slot: front-title
    aliases: [bezeichnung, anzeigename, display-name]
    description:
      de: "Name der Karte. Fehlt er, gilt der Dateiname."
      en: "The card's name. Falls back to the file name."

  description:
    slot: front-text
    aliases: [beschreibung]
    description:
      de: "Beschreibung oder Stimmungstext — im Block, oder als Abschnitt `## Beschreibung` der Notiz."
      en: "A description or flavour — in the block, or as a `## Beschreibung` section of the note."

  image:
    slot: back-image
    aliases: [bild, img]
    description:
      de: "Bild der Karte als Wikilink (`[[Langschwert.png]]`), Embed oder Dateiname — auf der Rückseite, groß."
      en: "The card's picture as a wikilink (`[[Langschwert.png]]`), embed or file name — on the back, large."
    sample: "[[Jagdspeer.png]]"

  reference:
    slot: front-footer
    aliases: [referenz, buch, quelle]
    description:
      de: "Quellenangabe — Regelbuchseite oder Wikilink."
      en: "Source reference — rulebook page or wikilink."
    sample:
      de: "Regelbuch S. 74"
      en: "Rulebook p. 74"

translations:
  de:
    back-label: "Der Eine Ring"
  en:
    back-label: "The One Ring"

card-types:
  gear: card-types/gear.yaml
  npc:  card-types/npc.yaml
