id: pf2e
name: "Pathfinder 2nd Edition"

# Modelled on the official German "Monsterkarten": a clean sans-serif stat
# block on warm cream, a name and a level badge over a red rule, a row of
# coloured trait pills, bold labels leading each line. Written in German
# throughout — the aliases and the captions follow the Monsterhandbuch, so
# a card can be read beside the open page. The sample values are invented:
# realistic in shape, but no creature, item, feat, action or hazard of any
# published book.
#
# Five card types, five fronts: a stat block is a fixed sequence of lines
# that the rulebook orders, and the places on each front are those lines —
# `front-perception`, `front-saves`, `front-price` — named after the line's
# role because the order is the design. What the five share is furniture,
# and the furniture is partials: the header row, the trait pills, one
# labelled stat line, the list of attacks or effects, a list of labelled
# pairs, the footer.
languages: [de]

stylesheet: styles/pf2e.css

partial-templates:
  header: templates/header.hbs
  trait-row: templates/trait-row.hbs
  stat-line: templates/stat-line.hbs
  pairs: templates/pairs.hbs
  entry-list: templates/entry-list.hbs
  footer: templates/footer.hbs

# A long stat block continues on further cards; the back is a designed face
# (the banner, the picture) and stays one.
overflow-mode: extra-cards

# ── Shared vocabulary ─────────────────────────────────────────────────
#
# Bound here: the places every card type fills the same way — the title,
# the two footer lines, the picture on the back. The five defences that
# mean the same on a creature, an item and a hazard are DEFINED here, with
# their aliases and their documentation, and BOUND by each card type whose
# front has a line for them; a feat has none, and a binding to a place its
# front never reads is what the loader reports.
properties:
  name:
    slot: front-title
    description:
      de: "Name der Karte — Kreatur, Gegenstand, Talent, Aktion oder Falle. Fehlt er, gilt der Dateiname."
      en: "The card's name — creature, item, feat, action or hazard. Falls back to the note's file name."
    sample:
      de: "Sumpfschleicher"
      en: "Marsh Lurker"

  image:
    slot: back-image
    description:
      de: "Bild der Karte als Wikilink (`[[Basilisk.png]]`), Embed (`![[Basilisk.png]]`) oder Dateiname. Erscheint groß auf der Kartenrückseite; Kreaturen und Gegenstände zeigen es außerdem auf der Vorderseite, wenn dort Platz bleibt."
      en: "The card's picture as a wikilink (`[[Basilisk.png]]`), embed (`![[Basilisk.png]]`) or file name. Shown large on the card back; creatures and items also show it on the front when there is room."
    sample: "[[Sumpfschleicher.png]]"

  source:
    slot: front-footer-right
    aliases: [sourcebook, buch, quelle, referenz]
    description:
      de: "Quellenangabe — Buchtitel und Seitenzahl, optional als Wikilink (`[[…]]`). Steht klein rechts unten auf der Karte."
      en: "Source reference — book title and page number, optionally a wikilink (`[[…]]`). Set small at the bottom right of the card."
    sample:
      de: "Monsterhandbuch S. 35"
      en: "Bestiary p. 38"

  original-name:
    slot: front-footer-left
    aliases: [english, englisch, english-name, originalname]
    description:
      de: "Englischer Originalname. Steht klein links unten auf der Karte, mit dem Präfix „engl.“; auf englischen Karten ausgeblendet."
      en: "English original name. Set small at the bottom left of the card, prefixed \"engl.\"; hidden on English cards."
    sample: "Marsh Lurker"

  hit-points:
    aliases: [hp, tp, lp, trefferpunkte, lebenspunkte]
    description:
      de: "Trefferpunkte (TP). Kurzformen `hp`, `tp`, `lp` werden als Aliase akzeptiert."
      en: "Hit Points (HP). The short forms `hp`, `tp` and `lp` are accepted as aliases."
    sample: 75

  armor-class:
    aliases: [ac, rk, rüstungsklasse]
    description:
      de: "Rüstungsklasse (RK). Kurzformen `ac` und `rk` werden als Aliase akzeptiert."
      en: "Armor Class (AC). The short forms `ac` and `rk` are accepted as aliases."
    sample: 22

  saves:
    aliases: [rettungswürfe, rettungswuerfe, rettung]
    description:
      de: "Rettungswürfe als Liste einzelner Schlüssel-Wert-Paare, in der Reihenfolge des Monsterhandbuchs: `ZÄH` (Zähigkeit), `REF` (Reflex), `WIL` (Willen). Das Vorzeichen wird beim Drucken ergänzt."
      en: "Saves as a list of single-key pairs, in the Monsterhandbuch's order: `ZÄH` (Fortitude), `REF` (Reflex), `WIL` (Will). The sign is added when printed."
    sample:
      - { ZÄH: 14 }
      - { REF: 8 }
      - { WIL: 11 }

  immunities:
    aliases: [immunitäten, immunitaeten]
    description:
      de: "Immunitäten als Freitext — kommagetrennte Schadensarten und Zustände, z. B. `Bewusstlos, Gift, Mental`."
      en: "Immunities as free text — comma-separated damage types and conditions, e.g. `unconscious, poison, mental`."
    sample:
      de: "Bewusstlos, Gift, Mental"
      en: "unconscious, poison, mental"

  hardness:
    aliases: [härte, haerte]
    description:
      de: "Härte als Freitext, z. B. `8` oder `8 (pro Eckmechanismus)`. Schaden wird um diesen Wert verringert."
      en: "Hardness as free text, e.g. `8` or `8 (per corner mechanism)`. Damage taken is reduced by it."
    sample: "8"

# The strings the shared partials read that are not a place's caption.
translations:
  de:
    back-label: "Pathfinder 2e"
    # The upright prefix before the English original name in the footer.
    front-footer-left-label: "engl."
    # Inline labels inside an attack or effect entry.
    entry-damage-label: "Schaden"
    entry-effect-label: "Effekt"

# The trait pills. Every trait prints in the dark maroon of the printed
# book except a rarity, which the Monsterhandbuch sets apart in terracotta.
# Matched on the display text, case-insensitively, against the German
# rarity words; the alignment and size pills of a creature are places of
# their own and carry a fixed colour, so no pattern has to know the
# vocabulary of sizes.
classifiers:
  front-traits:
    match:
      - { pattern: "^(ungewöhnlich|ungewohnlich)$", token: rarity }
      - { pattern: "^selten$", token: rarity }
      - { pattern: "^einzigartig$", token: rarity }
    default: generic

# The action cost, written the friendly way and printed as the glyph of
# the bundled action font. A note may also write the glyph itself; a
# value not in the table passes through as written.
glyphs:
  front-title-glyph: &action-glyphs
    "1": "⬻"
    "1a": "⬻"
    "2": "⬺"
    "2a": "⬺"
    "3": "⬽"
    "3a": "⬽"
    "r": "⬲"
    "reaction": "⬲"
    "reaktion": "⬲"
    "f": "⭓"
    "0": "⭓"
    "free": "⭓"
    "frei": "⭓"
  # An item's activations carry their cost as a field; the list renders
  # every field through this table, and only the cost is ever one of its
  # keys.
  front-activations: *action-glyphs

card-types:
  # ── creature ────────────────────────────────────────────────────────
  # The Monsterkarte: name and level, the trait row with alignment and
  # size in their own colours, perception and skills, the six attributes,
  # the defences, the speed, then the attacks and abilities. Printed on
  # the `large` card — a stat block wants the room — and the portrait
  # below the block when it clears 10 mm, else not at all.
  creature:
    front-template: templates/creature-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/creature.css
    card-size: large

    layouts:
      - { name: image-bottom, front-face-count: any, eligible-if: { element: hero, min-height: 10mm } }
      - { name: image-none, front-face-count: any, fallback: true }
    layout-decision:
      order:
        - { metric: element-size, element: hero, dimension: height, direction: maximize }
      tie-break: declaration-order

    translations:
      de:
        back-label: "Kreatur"
        front-perception-label: "Wahrnehmung"
        front-skills-label: "Fertigkeiten"
        front-items-label: "Gegenstände"
        front-armor-class-label: "RK"
        front-hit-points-label: "TP"
        front-immunities-label: "Immunitäten"
        front-resistances-label: "Resistenzen"
        front-weaknesses-label: "Schwächen"
        front-stride-label: "Laufen"
        front-speed-label: "Bewegungsrate"

    properties:
      image:
        slot: [front-image, back-image]
      hit-points:
        slot: front-hit-points
      armor-class:
        slot: front-armor-class
      saves:
        slot: front-saves
      immunities:
        slot: front-immunities

      level:
        slot: front-badge
        aliases: [stufe]
        description:
          de: "Stufe der Kreatur, üblicherweise als `Kreatur N` (z. B. `Kreatur 5`). Erscheint als Abzeichen rechts in der Kopfzeile."
          en: "Creature level, conventionally `Creature N` (e.g. `Creature 5`). Shown as the badge at the right of the header."
        sample:
          de: "Kreatur 5"
          en: "Creature 5"

      alignment:
        slot: front-alignment
        aliases: [gesinnung]
        description:
          de: "Gesinnung als Kürzel (`N`, `NB`, `CB`, `RG` …). Die erste Pille der Merkmalszeile, in Schieferblau."
          en: "Alignment code (`N`, `NB`, `CB`, `RG`, …). The first pill of the trait row, in slate blue."
        sample: "N"

      size:
        slot: front-size
        aliases: [größe, groesse]
        description:
          de: "Größe der Kreatur (`winzig`, `klein`, `mittelgroß`, `groß`, `riesig`, `gigantisch`). Die zweite Pille der Merkmalszeile, in Grün."
          en: "Creature size (`winzig`, `klein`, `mittelgroß`, `groß`, `riesig`, `gigantisch`). The second pill of the trait row, in green."
        sample:
          de: "mittelgroß"
          en: "medium"

      traits:
        slot: front-traits
        aliases: [merkmale]
        description:
          de: "Liste der Merkmale — Kreaturentyp, Themen, Seltenheit. Jeder Eintrag wird eine Pille; die Seltenheiten `ungewöhnlich`, `selten` und `einzigartig` erhalten die Seltenheitsfarbe."
          en: "List of traits — creature type, themes, rarity. Each entry becomes a pill; the rarities `ungewöhnlich`, `selten` and `einzigartig` take the rarity colour."
        sample:
          de: ["Bestie", "Sumpf"]
          en: ["Beast", "Swamp"]

      perception:
        slot: front-perception
        aliases: [wahrnehmung, modifier]
        description:
          de: "Wahrnehmungs-Modifikator als ganze Zahl; das Vorzeichen wird beim Drucken ergänzt."
          en: "Perception modifier as a plain integer; the sign is added when printed."
        sample: 11

      senses:
        slot: front-senses
        aliases: [sinne]
        description:
          de: "Besondere Sinne als Freitext (z. B. `Dunkelsicht`, `Dämmersicht`, `Lebensspüren 18 m`), hinter dem Wahrnehmungs-Modifikator."
          en: "Special senses as free text (e.g. `darkvision`, `low-light vision`, `lifesense 60 ft.`), after the perception modifier."
        sample:
          de: "Dunkelsicht"
          en: "darkvision"

      skills:
        slot: front-skills
        aliases: [fertigkeiten]
        description:
          de: "Fertigkeiten als Liste einzelner Schlüssel-Wert-Paare (`{ Fertigkeit: Modifikator }`); das Vorzeichen wird beim Drucken ergänzt."
          en: "Skills as a list of single-key pairs (`{ Skill: modifier }`); the sign is added when printed."
        sample:
          de:
            - { Athletik: 13 }
            - { Heimlichkeit: 8 }
          en:
            - { Athletics: 13 }
            - { Stealth: 8 }

      attributes:
        slot: front-attributes
        aliases: [attribute, attributswerte]
        description:
          de: "Attributswerte als Liste einzelner Schlüssel-Wert-Paare (`{ Kürzel: Modifikator }`), in der Reihenfolge ST, GE, KO, IN, WE, CH. Das Vorzeichen wird beim Drucken ergänzt."
          en: "Attribute modifiers as a list of single-key pairs (`{ Abbr: modifier }`), in the order ST, GE, KO, IN, WE, CH. The sign is added when printed."
        sample:
          de:
            - { ST: 4 }
            - { GE: -1 }
            - { KO: 5 }
            - { IN: -3 }
            - { WE: 2 }
            - { CH: 1 }
          en:
            - { Str: 4 }
            - { Dex: -1 }
            - { Con: 5 }
            - { Int: -3 }
            - { Wis: 2 }
            - { Cha: 1 }

      items:
        slot: front-items
        aliases: [ausrüstung, ausruestung, gegenstände, gegenstaende]
        description:
          de: "Mitgeführte Ausrüstung als Freitext, kommagetrennt. Tiere und geistlose Wesen haben meist keine — dann das Feld weglassen."
          en: "Carried equipment as free text, comma-separated. Beasts and mindless creatures usually have none — omit the field then."
        sample:
          de: "Speer, Lederrüstung"
          en: "spear, leather armor"

      resistances:
        slot: front-resistances
        aliases: [resistenzen]
        description:
          de: "Resistenzen als Freitext in der Form `Schadensart Wert`, kommagetrennt (z. B. `Feuer 5, Kälte 5`)."
          en: "Resistances as free text in the form `damage-type value`, comma-separated (e.g. `fire 5, cold 5`)."
        sample:
          de: "Feuer 5, Kälte 5"
          en: "fire 5, cold 5"

      weaknesses:
        slot: front-weaknesses
        aliases: [schwächen, schwaechen]
        description:
          de: "Schwächen als Freitext in der Form `Schadensart Wert`, kommagetrennt (z. B. `Heilig 5`)."
          en: "Weaknesses as free text in the form `damage-type value`, comma-separated (e.g. `holy 5`)."
        sample:
          de: "Heilig 5"
          en: "holy 5"

      stride:
        slot: front-stride
        aliases: [laufen]
        description:
          de: "Einfache Bewegung als Freitext (z. B. `6 m`, `7,5 m`). Die Karte stellt das Aktionssymbol ⬻ voran — das Symbol daher nicht mitschreiben. Bei mehreren Bewegungsarten stattdessen `speed` verwenden."
          en: "Simple movement as free text (e.g. `20 feet`, `25 ft.`). The card puts the ⬻ action glyph in front — do not write it into the value. For several movement modes use `speed` instead."
        sample:
          de: "7,5 m"
          en: "25 feet"

      speed:
        slot: front-speed
        aliases: [bewegungsrate]
        description:
          de: "Vollständige Bewegungszeile als Freitext, wenn die Kreatur mehrere Bewegungsarten hat (z. B. `9 m, Klettern 6 m, Fliegen 12 m`). Ohne Aktionssymbol; nur nutzen, wenn `stride` nicht gesetzt ist."
          en: "Full movement line as free text when the creature has several movement modes (e.g. `30 ft., climb 20 ft., fly 40 ft.`). No action glyph; use only when `stride` is not set."
        sample:
          de: "9 m, Klettern 6 m"
          en: "30 ft., climb 20 ft."

      attacks:
        slot: front-entries
        aliases: [angriffe, fähigkeiten, faehigkeiten]
        description:
          de: |
            Angriffe, Aktionen und Fähigkeiten der Kreatur als Liste. Jeder Eintrag ist ein Objekt aus optionalen Feldern; die Karte druckt nur, was gesetzt ist:

            | Feld     | Bedeutung                                                                                   |
            | -------- | ------------------------------------------------------------------------------------------- |
            | `name`   | Art und Name, mit Markdown-Fett für die Art und dem Aktionssymbol: `__Nahkampfangriff__ ⬻ Biss` |
            | `bonus`  | Angriffsmodifikator (`+7` oder `7`; das Vorzeichen wird ergänzt)                            |
            | `damage` | Schadensausdruck mit Schadensart, z. B. `1W6+1 Stich plus Niederwerfen`                    |
            | `desc`   | Freitext für Fähigkeiten, Auslöser und Zauberlisten                                         |
            | `effect` | Zusatzeffekt, z. B. anhaltender Schaden                                                    |

            Aktionssymbole: ⬻ (1 Aktion), ⬺ (2 Aktionen), ⬽ (3 Aktionen), ⬲ (Reaktion), ⭓ (freie Aktion).
          en: |
            The creature's attacks, actions and abilities as a list. Each entry is an object of optional fields; the card prints what is set:

            | Field    | Meaning                                                                                       |
            | -------- | --------------------------------------------------------------------------------------------- |
            | `name`   | Kind and name, with markdown bold for the kind and the action glyph: `__Melee__ ⬻ jaws`      |
            | `bonus`  | Attack modifier (`+7` or `7`; the sign is added)                                              |
            | `damage` | Damage expression with its type, e.g. `1d6+1 piercing plus Knockdown`                         |
            | `desc`   | Free text for abilities, triggers and spell lists                                             |
            | `effect` | Additional effect, e.g. persistent damage                                                     |

            Action glyphs: ⬻ (one action), ⬺ (two actions), ⬽ (three actions), ⬲ (reaction), ⭓ (free action).
        sample:
          de:
            - name: "__Nahkampfangriff__ ⬻ Biss"
              bonus: 7
              damage: "1W6+1 Stich plus Niederwerfen"
            - name: "__Sumpftarnung__"
              desc: "Im Schilf oder unter Wasser erhält der Sumpfschleicher +2 auf Heimlichkeit."
            - name: "__Wildheit__ ⬲"
              desc: "Wird der Sumpfschleicher auf 0 TP reduziert, bleibt er bei 1 TP; er erhält Verwundet 1."
          en:
            - name: "__Melee__ ⬻ jaws"
              bonus: 7
              damage: "1d6+1 piercing plus Knockdown"
            - name: "__Marsh Camouflage__"
              desc: "In reeds or under water the marsh lurker gains +2 to Stealth."
            - name: "__Ferocity__ ⬲"
              desc: "When reduced to 0 HP the marsh lurker stays at 1 HP; its wounded value increases by 1."

      description:
        slot: front-text
        aliases: [beschreibung]
        description:
          de: "Beschreibung oder Hintergrund als Markdown, kursiv unter den Angriffen."
          en: "Description or lore as markdown, in italics below the attacks."
        sample:
          de: "Ein flacher, schlammfarbener Leib mit zu vielen Augen, der erst auffällt, wenn das Wasser sich bewegt."
          en: "A flat, mud-coloured body with too many eyes, noticed only when the water moves."

  # ── item ────────────────────────────────────────────────────────────
  # Magic items, weapons, armour and shields on one card type: the stat
  # lines are all optional and print in the rulebook's order, so a sword
  # shows damage and bulk, a breastplate its AC bonus and penalties. The
  # picture sits beside the stat lines when it clears 10 mm there, else
  # below the text, else not at all.
  item:
    front-template: templates/item-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/item.css

    layouts:
      - { name: image-side, front-face-count: any, eligible-if: { element: hero, min-height: 10mm } }
      - { name: image-bottom, front-face-count: any, eligible-if: { element: hero, min-height: 10mm } }
      - { name: image-none, front-face-count: any, fallback: true }
    layout-decision:
      order:
        - { metric: element-size, element: hero, dimension: height, direction: maximize }
      tie-break: declaration-order

    translations:
      de:
        back-label: "Gegenstand"
        front-price-label: "Preis"
        front-damage-label: "Schaden"
        front-range-label: "Reichweite"
        front-reload-label: "Nachladen"
        front-ac-bonus-label: "RK-Bonus"
        front-dex-cap-label: "GE-Limit"
        front-check-penalty-label: "Rüstungsmalus"
        front-speed-penalty-label: "Bewegungsmalus"
        front-strength-label: "Stärke"
        front-bulk-label: "Last"
        front-hardness-label: "Härte"
        front-hit-points-label: "Trefferpunkte"
        front-broken-threshold-label: "Beschädigtwert"
        front-usage-label: "Nutzung"
        # Inline labels inside an activation entry.
        activation-frequency-label: "Frequenz"
        activation-trigger-label: "Auslöser"
        activation-requirements-label: "Voraussetzungen"
        activation-effect-label: "Wirkung"

    properties:
      image:
        slot: [front-image, back-image]

      level:
        slot: front-badge
        aliases: [stufe]
        description:
          de: "Stufe oder Kategorie als Freitext: bei magischen Gegenständen `Gegenstand N`, bei Waffen, Rüstungen und Schilden ohne Stufe das Wort (`Waffe`, `Rüstung`, `Schild`). Erscheint als Abzeichen rechts in der Kopfzeile."
          en: "Level or category as free text: `Item N` for magic items, the word for mundane gear without a level (`Weapon`, `Armor`, `Shield`). Shown as the badge at the right of the header."
        sample:
          de: "Gegenstand 5"
          en: "Item 5"

      traits:
        slot: front-traits
        aliases: [merkmale, eigenschaften]
        description:
          de: "Liste der Merkmale — Magieschule, Tradition, Kategorie, Schadensart, Seltenheit. Jeder Eintrag wird eine Pille; die Seltenheiten `ungewöhnlich`, `selten` und `einzigartig` erhalten die Seltenheitsfarbe."
          en: "List of traits — school, tradition, category, damage type, rarity. Each entry becomes a pill; the rarities `ungewöhnlich`, `selten` and `einzigartig` take the rarity colour."
        sample:
          de: ["Bannmagie", "Magisch"]
          en: ["Abjuration", "Magical"]

      price:
        slot: front-price
        aliases: [preis, kosten]
        description:
          de: "Preis als Freitext, üblicherweise in Goldmünzen (`160 GM`)."
          en: "Price as free text, conventionally in gold pieces (`160 gp`)."
        sample:
          de: "160 GM"
          en: "160 gp"

      damage:
        slot: front-damage
        aliases: [schaden]
        description:
          de: "Waffenschaden als Würfelausdruck mit Schadensart: `1W8 S` (Stich), `1W6 W` (Wucht), `1W6 H` (Hieb)."
          en: "Weapon damage as a dice expression with its type: `1d8 P` (piercing), `1d6 B` (bludgeoning), `1d6 S` (slashing)."
        sample:
          de: "1W8 S"
          en: "1d8 P"

      range:
        slot: front-range
        aliases: [reichweite]
        description:
          de: "Reichweite einer Fernkampfwaffe als Freitext (z. B. `36 m`)."
          en: "Range of a ranged weapon as free text (e.g. `120 ft.`)."
        sample:
          de: "36 m"
          en: "120 ft."

      reload:
        slot: front-reload
        aliases: [nachladen]
        description:
          de: "Nachladewert einer Fernkampfwaffe (`0`, `1`, `2`, `1+`, `—`)."
          en: "Reload value of a ranged weapon (`0`, `1`, `2`, `1+`, `—`)."
        sample: "1"

      ac-bonus:
        slot: front-ac-bonus
        aliases: [rk-bonus]
        description:
          de: "RK-Bonus einer Rüstung als Freitext (`+0`, `+1`, `+2`, …)."
          en: "Armor's AC bonus as free text (`+0`, `+1`, `+2`, …)."
        sample: "+2"

      dex-cap:
        slot: front-dex-cap
        aliases: [ge-limit]
        description:
          de: "GE-Limit der Rüstung als Freitext (`+5`, `+3`, `+0`, `—`)."
          en: "Armor's Dex cap as free text (`+5`, `+3`, `+0`, `—`)."
        sample: "+3"

      check-penalty:
        slot: front-check-penalty
        aliases: [rüstungsmalus, ruestungsmalus]
        description:
          de: "Rüstungsmalus auf Fertigkeitswürfe als Freitext (`—`, `–1`, `–2`, `–3`)."
          en: "Armor's check penalty as free text (`—`, `–1`, `–2`, `–3`)."
        sample: "–1"

      speed-penalty:
        slot: front-speed-penalty
        aliases: [bewegungsmalus]
        description:
          de: "Bewegungsmalus der Rüstung als Freitext (`—`, `–1,5 m`, `–3 m`)."
          en: "Armor's speed penalty as free text (`—`, `–5 ft.`, `–10 ft.`)."
        sample:
          de: "–1,5 m"
          en: "–5 ft."

      strength:
        slot: front-strength
        aliases: [stärke, staerke]
        description:
          de: "Stärkeschwelle der Rüstung (`10`, `12`, `14`, `16`, `18`, `—`). Ab diesem Wert entfällt der Rüstungsmalus."
          en: "Armor's strength threshold (`10`, `12`, `14`, `16`, `18`, `—`). At or above it the check penalty no longer applies."
        sample: "12"

      bulk:
        slot: front-bulk
        aliases: [last]
        description:
          de: "Last als Freitext (`L` für leicht, `1`, `2`, `—`)."
          en: "Bulk as free text (`L` for light, `1`, `2`, `—`)."
        sample: "L"

      hardness:
        slot: front-hardness
        description:
          de: "Härte eines Schildes oder Gegenstands (`3`, `5`, …). Schaden am Gegenstand wird um diesen Wert verringert."
          en: "Hardness of a shield or item (`3`, `5`, …). Damage the item takes is reduced by it."
        sample: "5"

      hit-points:
        slot: front-hit-points
        description:
          de: "Trefferpunkte eines Schildes oder Gegenstands als Zahl (`20`)."
          en: "Hit points of a shield or item as a number (`20`)."
        sample: "20"

      broken-threshold:
        slot: front-broken-threshold
        aliases: [bw, beschädigtwert, beschaedigtwert]
        description:
          de: "Beschädigtwert eines Schildes oder Gegenstands als Zahl (`10`). Bei diesem TP-Wert gilt er als beschädigt."
          en: "Broken threshold of a shield or item as a number (`10`). At this HP value it counts as broken."
        sample: "10"

      usage:
        slot: front-usage
        aliases: [nutzung, verwendung]
        description:
          de: "Nutzung (`In 1 Hand gehalten`, `In 2 Händen gehalten`, `Getragen`, `Getragen (Gürtel)`)."
          en: "Usage (`Held in 1 hand`, `Held in 2 hands`, `Worn`, `Worn (belt)`)."
        sample:
          de: "In 1 Hand gehalten"
          en: "Held in 1 hand"

      description:
        slot: front-text
        aliases: [beschreibung]
        description:
          de: "Beschreibung des Gegenstands als Markdown — der Hauptteil der Karte."
          en: "Item description as markdown — the main body of the card."
        sample:
          de: "Runen auf der Innenseite dieser Rüstung wärmen ihren Träger und halten Nebel und Nieselregen fern. Der Gegenstandsbonus auf die RK ist um 1 höher."
          en: "Runes on the inside of this armor keep the wearer warm and shed mist and drizzle. Its item bonus to AC is 1 higher."

      trait-descriptions:
        slot: front-trait-notes
        aliases: [merkmalsbeschreibungen, merkmals-beschreibungen]
        description:
          de: |
            Erläuterungen zu den Merkmalen als Liste von Objekten mit `name` (fett gesetzt) und `desc` (Markdown). Steht nach der Beschreibung als eigene Liste, jeder Eintrag mit `*` davor.
          en: |
            Explanations of the traits as a list of objects with `name` (set bold) and `desc` (markdown). Printed after the description as its own list, each entry led by `*`.
        sample:
          de:
            - name: "Bollwerk"
              desc: "Auf Reflexwürfe gegen Schadenseffekte addierst du +3 statt deines Geschicklichkeitsmodifikators."
          en:
            - name: "Bulwark"
              desc: "On Reflex saves against damaging effects you add +3 instead of your Dexterity modifier."

      activations:
        slot: front-activations
        aliases: [aktivierungen, sonderaktionen]
        description:
          de: |
            Aktivierbare Fähigkeiten des Gegenstands als Liste. Jeder Eintrag ist ein Objekt aus optionalen Feldern; die Karte druckt nur, was gesetzt ist:

            | Feld           | Bedeutung                                                              |
            | -------------- | ---------------------------------------------------------------------- |
            | `name`         | Name der Fähigkeit oder das Wort `Aktivieren` (fett gesetzt)           |
            | `actions`      | Aktionskosten — `1`, `2`, `3`, `r` (Reaktion), `f` (frei) oder das Symbol |
            | `components`   | Aktivierungskomponenten ohne Klammern, z. B. `Konzentration`          |
            | `frequency`    | Häufigkeit, z. B. `1/Tag`                                              |
            | `trigger`      | Auslöser bei Reaktionen                                                |
            | `requirements` | Voraussetzungen der Aktivierung                                        |
            | `effect`       | Wirkung                                                                |
            | `desc`         | Freitext im Anschluss                                                  |
          en: |
            Activated abilities of the item as a list. Each entry is an object of optional fields; the card prints what is set:

            | Field          | Meaning                                                                  |
            | -------------- | ------------------------------------------------------------------------ |
            | `name`         | Ability name or the word `Activate` (set bold)                           |
            | `actions`      | Action cost — `1`, `2`, `3`, `r` (reaction), `f` (free) or the glyph     |
            | `components`   | Activation components without parentheses, e.g. `concentrate`           |
            | `frequency`    | Frequency, e.g. `1/day`                                                  |
            | `trigger`      | Trigger of a reaction                                                    |
            | `requirements` | Requirements of the activation                                           |
            | `effect`       | Effect                                                                   |
            | `desc`         | Trailing free text                                                       |
        sample:
          de:
            - name: "Aktivieren"
              actions: "1"
              components: "Konzentration"
              frequency: "einmal pro Stunde"
              effect: "Bis zum Ende deines Zuges verursacht die Rüstung 1W6 Kälteschaden an jedem, der dich trifft."
          en:
            - name: "Activate"
              actions: "1"
              components: "concentrate"
              frequency: "once per hour"
              effect: "Until the end of your turn the armor deals 1d6 cold damage to anyone who hits you."

  # ── feat ────────────────────────────────────────────────────────────
  # The most numerous card: name, action cost and level in the header, the
  # trait pills, the prerequisites and the other labelled lines, then the
  # rules text, then the "Speziell" note.
  feat:
    front-template: templates/feat-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/feat.css

    translations:
      de:
        back-label: "Talent"
        front-prerequisites-label: "Voraussetzungen"
        front-frequency-label: "Häufigkeit"
        front-trigger-label: "Auslöser"
        front-requirements-label: "Anforderungen"
        front-special-label: "Speziell"

    properties:
      level:
        slot: front-badge
        aliases: [stufe, talentstufe]
        description:
          de: "Stufe des Talents als Freitext, üblicherweise `Talent N` (z. B. `Talent 1`). Erscheint als Abzeichen rechts in der Kopfzeile."
          en: "Feat level as free text, conventionally `Feat N` (e.g. `Feat 1`). Shown as the badge at the right of the header."
        sample:
          de: "Talent 1"
          en: "Feat 1"

      action-cost:
        slot: front-title-glyph
        aliases: [actions, aktionen, aktion, kosten]
        description:
          de: "Aktionskosten des Talents, neben dem Namen als Symbol gedruckt: `1`, `2`, `3`, `r` (Reaktion), `f` (frei) oder das Symbol selbst. Passive Talente lassen das Feld weg."
          en: "The feat's action cost, printed as a glyph beside the name: `1`, `2`, `3`, `r` (reaction), `f` (free) or the glyph itself. Passive feats omit it."
        sample: "1"

      traits:
        slot: front-traits
        aliases: [merkmale, kategorien]
        description:
          de: "Liste der Merkmale — Seltenheit, Talentkategorie (`Allgemein`, `Fertigkeit`, Klasse, Abstammung) und mechanische Merkmale (`Konzentration`, `Manipulation`, `Heilung`). Jeder Eintrag wird eine Pille; die Seltenheiten erhalten die Seltenheitsfarbe."
          en: "List of traits — rarity, feat category (`Allgemein`, `Fertigkeit`, class, ancestry) and mechanical traits (`Konzentration`, `Manipulation`, `Heilung`). Each entry becomes a pill; the rarities take the rarity colour."
        sample:
          de: ["Allgemein", "Fertigkeit"]
          en: ["General", "Skill"]

      prerequisites:
        slot: front-prerequisites
        aliases: [voraussetzungen]
        description:
          de: "Voraussetzungen für die Wahl des Talents — Fertigkeitsgrade, Attributswerte, andere Talente."
          en: "Prerequisites for taking the feat — proficiency ranks, ability scores, other feats."
        sample:
          de: "Geübt in Heilkunde"
          en: "trained in Medicine"

      frequency:
        slot: front-frequency
        aliases: [häufigkeit, haeufigkeit]
        description:
          de: "Wie oft das Talent genutzt werden kann (z. B. `einmal pro Runde`, `einmal pro Tag`)."
          en: "How often the feat may be used (e.g. `once per round`, `once per day`)."
        sample:
          de: "einmal pro Stunde"
          en: "once per hour"

      trigger:
        slot: front-trigger
        aliases: [auslöser, ausloeser]
        description:
          de: "Auslöser bei Reaktionen und manchen freien Aktionen."
          en: "Trigger of reactions and some free actions."
        sample:
          de: "Du hast deinen Schild gehoben und würdest durch einen physischen Angriff Schaden erleiden."
          en: "While you have your shield raised, you would take damage from a physical attack."

      requirements:
        slot: front-requirements
        aliases: [anforderungen]
        description:
          de: "Anforderungen beim Einsatz — der Zustand oder Gegenstand, der im Moment des Einsatzes vorliegen muss (im Unterschied zu den Voraussetzungen für die Wahl)."
          en: "Requirements at the time of use — the state or item that must apply then (as opposed to the prerequisites for taking the feat)."
        sample:
          de: "Du hast Heilerwerkzeuge in Händen oder griffbereit."
          en: "You're holding or wearing healer's tools."

      description:
        slot: front-text
        aliases: [beschreibung, text, effekt, wirkung]
        description:
          de: "Die Regel des Talents als Markdown — der Hauptteil der Karte. Erfolgsstufen können als Fettdruck im Text stehen (`**Erfolg** Du erkennst …`)."
          en: "The feat's rule as markdown — the main body of the card. Degrees of success may stand bold inside the text (`**Success** You notice …`)."
        sample:
          de: "Du kannst die Aktivität Herstellen nutzen, um alchemistische Gegenstände herzustellen. Wenn du dieses Talent wählst, trägst du sofort vier gewöhnliche Formeln des 1. Grades in dein Formelbuch ein."
          en: "You can use the Craft activity to create alchemical items. When you select this feat, you immediately add four common 1st-level formulas to your formula book."

      special:
        slot: front-special
        aliases: [speziell, besonderes]
        description:
          de: "Hinweis am Ende des Talents, meist die Mehrfachwahl-Klausel (`Du kannst dieses Talent mehrfach wählen.`)."
          en: "Trailing note, usually the multiple-selection clause (`You can select this feat more than once.`)."
        sample:
          de: "Du kannst dieses Talent mehrfach wählen. Wähle jedes Mal eine andere Fertigkeit."
          en: "You can select this feat more than once. Each time, choose a different skill."

  # ── action ──────────────────────────────────────────────────────────
  # A basic or skill action: the action cost beside the name, the skill
  # and its required rank as a two-line badge, the category pills, the
  # labelled lines, the effect, the four degrees of success, and an
  # optional tinted box for examples or a named sub-rule.
  action:
    front-template: templates/action-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/action.css

    translations:
      de:
        back-label: "Aktion"
        front-frequency-label: "Häufigkeit"
        front-trigger-label: "Auslöser"
        front-requirements-label: "Anforderungen"
        front-critical-success-label: "Kritischer Erfolg"
        front-success-label: "Erfolg"
        front-failure-label: "Fehlschlag"
        front-critical-failure-label: "Kritischer Fehlschlag"

    properties:
      actions:
        slot: front-title-glyph
        aliases: [aktionen, kosten, action-cost]
        description:
          de: "Aktionskosten, neben dem Namen als Symbol gedruckt: `1`, `2`, `3`, `r` (Reaktion), `f` (frei) oder das Symbol selbst."
          en: "Action cost, printed as a glyph beside the name: `1`, `2`, `3`, `r` (reaction), `f` (free) or the glyph itself."
        sample: "1"

      skill:
        slot: front-badge
        aliases: [fertigkeit, fertigkeiten]
        description:
          de: "Fertigkeit, zu der die Aktion gehört (z. B. `Akrobatik`, `Athletik`). Erscheint als Abzeichen rechts in der Kopfzeile; bei mehreren Fertigkeiten eine Liste, mit „/“ verbunden. Einfache Aktionen lassen das Feld weg."
          en: "Skill the action belongs to (e.g. `Akrobatik`, `Athletik`). Shown as the badge at the right of the header; a list for several skills, joined with \"/\". Basic actions omit it."
        sample:
          de: "Akrobatik"
          en: "Acrobatics"

      training:
        slot: front-badge-note
        aliases: [kompetenz, kompetenzgrad]
        description:
          de: "Erforderlicher Kompetenzgrad in der Fertigkeit (`ungeübt`, `geübt`, `Experte`, `Meister`, `Legende`), unter der Fertigkeit im Abzeichen."
          en: "Required proficiency rank in the skill (`ungeübt`, `geübt`, `Experte`, `Meister`, `Legende`), under the skill in the badge."
        sample:
          de: "geübt"
          en: "trained"

      categories:
        slot: front-traits
        aliases: [kategorien, merkmale]
        description:
          de: "Liste der Merkmale der Aktion (`Bewegung`, `Offensiv`, `Handhaben`, `Konzentration`, `Verdeckt`, `Erkundung`, …). Jeder Eintrag wird eine dunkelrote Pille unter dem Titel."
          en: "List of the action's traits (`Bewegung`, `Offensiv`, `Handhaben`, `Konzentration`, `Verdeckt`, `Erkundung`, …). Each entry becomes a dark-red pill under the title."
        sample:
          de: ["Offensiv"]
          en: ["Attack"]

      frequency:
        slot: front-frequency
        aliases: [häufigkeit, haeufigkeit]
        description:
          de: "Häufigkeit (z. B. `1/Tag`, `einmal pro Stunde`)."
          en: "Frequency (e.g. `1/day`, `once per hour`)."
        sample: ""

      trigger:
        slot: front-trigger
        aliases: [auslöser, ausloeser]
        description:
          de: "Auslöser der Aktion, bei Reaktionen und freien Aktionen."
          en: "Trigger of the action, for reactions and free actions."
        sample:
          de: "Du stürzt von einer Kante oder einem Haltegriff ab oder daran vorbei."
          en: "You fall from or past an edge or handhold."

      requirements:
        slot: front-requirements
        aliases: [anforderungen, voraussetzungen]
        description:
          de: "Anforderungen für die Ausführung der Aktion."
          en: "Requirements for performing the action."
        sample:
          de: "Deine Hände sind nicht gefesselt."
          en: "Your hands are not tied."

      description:
        slot: front-text
        aliases: [beschreibung, effekt, wirkung, text]
        description:
          de: "Wirkung der Aktion als Markdown — der Hauptteil der Karte."
          en: "The action's effect as markdown — the main body of the card."
        sample:
          de: "Wenn du von einer Kante abstürzt, kannst du versuchen, sie zu ergreifen. Dazu muss dir ein Reflexwurf gelingen, üblicherweise gegen den Klettern-SG."
          en: "When you fall off an edge, you can try to grab it. You must succeed at a Reflex save, usually at the Climb DC."

      critical-success:
        slot: front-critical-success
        aliases: [kritischer-erfolg, krit-erfolg]
        description:
          de: "Ergebnis bei kritischem Erfolg."
          en: "Outcome on a critical success."
        sample:
          de: "Du ergreifst den Halt, ob du eine Hand frei hast oder nicht, und behandelst den Sturz als 9 m kürzer."
          en: "You grab the edge whether or not you have a hand free, and treat the fall as 30 feet shorter."

      success:
        slot: front-success
        aliases: [erfolg]
        description:
          de: "Ergebnis bei Erfolg."
          en: "Outcome on a success."
        sample:
          de: "Mit mindestens einer freien Hand ergreifst du den Halt und behandelst den Sturz als 6 m kürzer."
          en: "With at least one hand free you grab the edge and treat the fall as 20 feet shorter."

      failure:
        slot: front-failure
        aliases: [fehlschlag, misserfolg]
        description:
          de: "Ergebnis bei Fehlschlag."
          en: "Outcome on a failure."
        sample: ""

      critical-failure:
        slot: front-critical-failure
        aliases: [kritischer-fehlschlag, krit-fehlschlag]
        description:
          de: "Ergebnis bei kritischem Fehlschlag."
          en: "Outcome on a critical failure."
        sample:
          de: "Du fällst weiter und nimmst zusätzlich 10 Wuchtschaden je 6 m, die du bereits gestürzt bist."
          en: "You continue to fall and take an additional 10 bludgeoning damage for every 20 feet already fallen."

      callout:
        slot: front-callout
        aliases: [beispiele, kasten, infokasten]
        description:
          de: |
            Kasten am Ende der Karte — eine Beispielliste oder eine benannte Nebenregel. Ein Objekt mit `title` (optional) und `body` (Markdown); ohne `title` steht der Text allein im getönten Kasten.

            ```yaml
            callout:
              title: "Beispiele"
              body: |
                - **Ungeübt** Leiter, steiler Hang
                - **Geübt** Takelage, Seil
            ```
          en: |
            Box at the end of the card — an example list or a named sub-rule. An object with `title` (optional) and `body` (markdown); without `title` the text stands alone in the tinted box.
        sample:
          de:
            title: "Erzwungene Bewegung"
            body: "Wird eine Kreatur durch einen Effekt bewegt, bestimmt der Effekt die Entfernung, nicht ihre Bewegungsrate; die Bewegung löst keine Reaktionen aus."
          en:
            title: "Forced Movement"
            body: "When an effect moves a creature, the effect sets the distance, not its Speed; the movement triggers no reactions."

  # ── trap ────────────────────────────────────────────────────────────
  # A hazard: the level badge, the trait pills, an italic lead, the notice
  # and disable lines, the defences behind a rule, the effects as the same
  # list shape a creature's attacks use, then the reset clause.
  trap:
    front-template: templates/trap-front.hbs
    back-template: templates/back.hbs
    stylesheet: styles/trap.css

    translations:
      de:
        back-label: "Falle"
        front-notice-label: "Bemerken"
        front-initiative-label: "Initiative"
        front-disarm-label: "Entschärfen"
        front-armor-class-label: "RK"
        front-hit-points-label: "TP"
        front-hardness-label: "Härte"
        front-immunities-label: "Immunitäten"
        front-reset-label: "Rücksetzer"

    properties:
      level:
        slot: front-badge
        aliases: [stufe, gefahr]
        description:
          de: "Gefahrenstufe der Falle (z. B. `Gefahr 1`, `Komplexe Gefahr 3`). Erscheint als Abzeichen rechts in der Kopfzeile."
          en: "Hazard level (e.g. `Hazard 1`, `Complex Hazard 3`). Shown as the badge at the right of the header."
        sample:
          de: "Gefahr 1"
          en: "Hazard 1"

      traits:
        slot: front-traits
        aliases: [merkmale]
        description:
          de: "Liste der Merkmale (`Mechanisch`, `Magisch`, `Komplex`, Seltenheit). Jeder Eintrag wird eine Pille; die Seltenheiten erhalten die Seltenheitsfarbe."
          en: "List of traits (`Mechanisch`, `Magisch`, `Komplex`, rarity). Each entry becomes a pill; the rarities take the rarity colour."
        sample:
          de: ["Mechanisch"]
          en: ["Mechanical"]

      description:
        slot: front-lead
        aliases: [beschreibung, text]
        description:
          de: "Einleitender Text — Auslöser, Umgebung, Funktionsweise — kursiv vor den Spielwerten."
          en: "Introductory text — trigger, surroundings, how it works — in italics before the stats."
        sample:
          de: "Eine Druckplatte im Boden löst einen Speerhagel aus der Westwand aus."
          en: "A pressure plate in the floor triggers a volley of spears from the west wall."

      notice:
        slot: front-notice
        aliases: [bemerken]
        description:
          de: "Bedingung zum Bemerken der Falle (z. B. `Wahrnehmungswurf, SG 20`)."
          en: "Condition for noticing the hazard (e.g. `Perception DC 20`)."
        sample:
          de: "Wahrnehmungswurf, SG 20"
          en: "Perception DC 20"

      initiative:
        slot: front-initiative
        description:
          de: "Initiative komplexer Fallen, die im Kampf eigene Aktionen haben (z. B. `Heimlichkeit +10`). Bei einfachen Fallen weglassen."
          en: "Initiative of complex hazards that act in combat (e.g. `Stealth +10`). Omit for simple traps."
        sample:
          de: "Heimlichkeit +10"
          en: "Stealth +10"

      disarm:
        slot: front-disarm
        aliases: [entschärfen, entschaerfen]
        description:
          de: "Bedingung zum Entschärfen (z. B. `Diebeskunst, SG 20`)."
          en: "Condition for disabling (e.g. `Thievery DC 20`)."
        sample:
          de: "Diebeskunst, SG 20"
          en: "Thievery DC 20"

      armor-class:
        slot: front-armor-class
        sample: 18

      saves:
        slot: front-saves
        sample:
          - { ZÄH: 7 }
          - { REF: 5 }

      hardness:
        slot: front-hardness

      hit-points:
        slot: front-hit-points
        description:
          de: "Trefferpunkte als Freitext (z. B. `15` oder `15 (pro Eckmechanismus)`)."
          en: "Hit points as free text (e.g. `15` or `15 (per corner mechanism)`)."
        sample: "15"

      immunities:
        slot: front-immunities
        sample:
          de: "Kritische Treffer, Mentale Effekte"
          en: "critical hits, mental"

      effects:
        slot: front-entries
        aliases: [aktionen, ablauf]
        description:
          de: |
            Aktionen, Angriffe und Effekte der Falle als Liste — derselbe Aufbau wie `attacks` bei einer Kreatur: `name` (mit Markdown-Fett und dem Aktionssymbol), `bonus`, `damage`, `desc`, `effect`.
          en: |
            The hazard's actions, attacks and effects as a list — the same shape as a creature's `attacks`: `name` (with markdown bold and the action glyph), `bonus`, `damage`, `desc`, `effect`.
        sample:
          de:
            - name: "__Speerhagel__ ⬲"
              desc: "Betritt eine Kreatur eines der markierten Felder, schießen drei Speere aus der Westwand."
            - name: "__Fernkampfangriff__ Speer"
              bonus: 10
              damage: "1W8+4 Stich"
          en:
            - name: "__Spear Volley__ ⬲"
              desc: "When a creature enters one of the marked squares, three spears shoot from the west wall."
            - name: "__Ranged__ spear"
              bonus: 10
              damage: "1d8+4 piercing"

      reset:
        slot: front-reset
        aliases: [rücksetzer, ruecksetzer]
        description:
          de: "Rücksetz-Bedingung als Freitext (z. B. `Setzt sich nach 1 Minute zurück.`), als letzte Zeile."
          en: "Reset condition as free text (e.g. `Resets after 1 minute.`), as the last line."
        sample:
          de: "Setzt sich nach 1 Minute zurück."
          en: "Resets after 1 minute."
